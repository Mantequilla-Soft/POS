# ─────────────────────────────────────────────────────────────
#  POSHIVE — nginx reverse proxy
#  Domain: pos.3speak.tv
#
#  Setup steps:
#    1. Copy to /etc/nginx/sites-available/poshive
#    2. ln -s /etc/nginx/sites-available/poshive /etc/nginx/sites-enabled/
#    3. nginx -t && systemctl reload nginx
#    4. certbot --nginx -d pos.3speak.tv
# ─────────────────────────────────────────────────────────────

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pos.3speak.tv;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.3speak.tv;

    # ── SSL (filled in by certbot) ────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/pos.3speak.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.3speak.tv/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header Referrer-Policy        "strict-origin"       always;
    add_header X-XSS-Protection       "1; mode=block"       always;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Upload size (increase if you expect large images) ─────
    client_max_body_size 10M;

    # ── Proxy to Node.js backend ──────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ── Uploaded images — serve directly, cache aggressively ──
    location /uploads/ {
        alias /opt/poshive/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Static assets — long cache ────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:3001;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/poshive.access.log;
    error_log  /var/log/nginx/poshive.error.log;
}
