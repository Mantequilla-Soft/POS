# ─────────────────────────────────────────────────────────────
#  POSHIVE — nginx config for pos.3speak.tv
#
#  Step-by-step:
#
#  1. Copy this file:
#       sudo cp docs/nginx.conf /etc/nginx/sites-available/poshive
#
#  2. Enable it:
#       sudo ln -s /etc/nginx/sites-available/poshive /etc/nginx/sites-enabled/poshive
#
#  3. Test and reload nginx:
#       sudo nginx -t && sudo systemctl reload nginx
#
#  4. Get your SSL certificate (certbot will edit this file automatically):
#       sudo certbot --nginx -d pos.3speak.tv
#
#  5. Reload nginx one more time:
#       sudo systemctl reload nginx
#
#  That's it. Certbot handles all the SSL lines — you don't write them manually.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name pos.3speak.tv;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Upload size ───────────────────────────────────────────
    client_max_body_size 10M;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Proxy to POSHIVE backend ──────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3007;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ── Uploaded images — cache aggressively ─────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:3007/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/poshive.access.log;
    error_log  /var/log/nginx/poshive.error.log;
}
