<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIVE POS - Login</title>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: var(--sh-lg);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .login-header {
            background: var(--ink);
            color: var(--ink-text);
            text-align: center;
            padding: 2rem 1.5rem 1.5rem;
        }

        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--ink-text);
        }

        .login-header p {
            opacity: 0.85;
            font-size: 0.95rem;
            color: var(--ink-text);
        }

        .form-container {
            padding: 2rem 1.5rem;
        }

        .form-toggle {
            display: flex;
            margin-bottom: 2rem;
            background: var(--surface-2);
            border-radius: var(--r);
            padding: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: var(--r-sm);
            font-weight: 500;
            transition: var(--ease);
            color: var(--text-2);
            font-family: var(--font);
        }

        .toggle-btn.active {
            background: var(--ink);
            color: var(--ink-text);
            box-shadow: var(--sh-xs);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--r);
            font-size: 1rem;
            transition: var(--ease);
            background: var(--surface);
            font-family: var(--font);
            color: var(--text);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--ink);
            box-shadow: 0 0 0 3px rgba(28,25,23,0.07);
        }

        .form-input:invalid {
            border-color: var(--red);
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-3);
            font-size: 0.9rem;
            padding: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--ink);
            color: var(--ink-text);
            border: none;
            border-radius: var(--r);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--ease);
            margin-bottom: 1.5rem;
            font-family: var(--font);
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--ink-hover);
            transform: translateY(-1px);
            box-shadow: var(--sh);
        }

        .submit-btn:disabled {
            background: var(--border);
            color: var(--text-3);
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-2);
            font-size: 0.9rem;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--ink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: var(--red-light);
            color: var(--red);
            padding: 12px 16px;
            border-radius: var(--r);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            border-left: 4px solid var(--red);
            display: none;
        }

        .success-message {
            background: var(--green-light);
            color: var(--green);
            padding: 12px 16px;
            border-radius: var(--r);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            border-left: 4px solid var(--green);
            display: none;
        }

        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-password a {
            color: var(--ink);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .requirements {
            font-size: 0.8rem;
            color: var(--text-3);
            margin-top: 0.5rem;
            line-height: 1.4;
        }

        /* Debug Features */
        .debug-section {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--surface-2);
            border-radius: var(--r);
            border: 1px solid var(--border);
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .debug-header h3 {
            margin: 0;
            color: var(--text-2);
            font-size: 1rem;
        }

        .service-status-btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: 0.9rem;
            font-family: var(--font);
            transition: var(--ease);
        }

        .service-status-btn:hover {
            opacity: 0.85;
        }

        .service-status-btn:disabled {
            background: var(--text-2);
            cursor: not-allowed;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 1rem;
            font-size: 0.9rem;
        }

        .debug-console {
            background: #2d3748;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: var(--r-sm);
            font-family: var(--mono);
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .debug-entry {
            margin-bottom: 0.5rem;
            padding: 0.25rem 0;
            border-bottom: 1px solid #4a5568;
        }

        .debug-entry:last-child {
            border-bottom: none;
        }

        .debug-timestamp {
            color: #cbd5e0;
            font-size: 0.7rem;
        }

        .debug-method {
            color: #68d391;
            font-weight: bold;
        }

        .debug-url {
            color: #90cdf4;
        }

        .debug-status {
            font-weight: bold;
        }

        .debug-status.success {
            color: #68d391;
        }

        .debug-status.error {
            color: #f56565;
        }

        .debug-clear {
            background: var(--red);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 1rem;
            font-family: var(--font);
        }

        .debug-clear:hover {
            background: #b91c1c;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 10px;
            }

            .form-container {
                padding: 1.5rem 1rem;
            }

            .login-header {
                padding: 1.5rem 1rem 1rem;
            }

            .debug-header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .debug-console {
                font-size: 0.7rem;
            }
        }
    </style>
  <link rel="manifest" href="manifest.json">
  <script src="pwa.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>HIVE POS</h1>
            <p data-i18n="login.subtitle">Point of Sale Administration</p>
        </div>
        
        <div class="form-container">
            <div class="form-toggle">
                <button class="toggle-btn active" id="loginToggle" data-i18n="login.tabLogin">Login</button>
                <button class="toggle-btn" id="cashierToggle" data-i18n="login.tabCashier">Cashier</button>
                <button class="toggle-btn" id="registerToggle" data-i18n="login.tabRegister">Register</button>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <div class="loading" id="loadingMessage">
                <div class="spinner"></div>
                <span>Processing...</span>
            </div>

            <!-- Login Form -->
            <form class="form-section active" id="loginForm">
                <div class="form-group">
                    <label for="loginUsername" data-i18n="login.usernameLabel">Username</label>
                    <input type="text" id="loginUsername" class="form-input" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="loginPassword" data-i18n="login.passwordLabel">Password</label>
                    <div class="password-container">
                        <input type="password" id="loginPassword" class="form-input" required autocomplete="current-password">
                        <button type="button" class="password-toggle" data-target="loginPassword">👁️</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="loginBtn" data-i18n="login.signIn">Sign In</button>

                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink" data-i18n="login.forgotPassword">Forgot your password?</a>
                </div>
            </form>

            <!-- Cashier Login Form -->
            <form class="form-section" id="cashierForm">
                <div class="form-group">
                    <label for="cashierUsername" data-i18n="login.usernameLabel">Username</label>
                    <input type="text" id="cashierUsername" class="form-input" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="cashierPassword" data-i18n="login.passwordLabel">Password</label>
                    <div class="password-container">
                        <input type="password" id="cashierPassword" class="form-input" required autocomplete="current-password">
                        <button type="button" class="password-toggle" data-target="cashierPassword">👁️</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="cashierStoreHive" data-i18n="login.storeHiveLabel">Store Hive Account <span style="font-weight:400;color:var(--text-3)" data-i18n="login.hiveOptional">(optional)</span></label>
                    <input type="text" id="cashierStoreHive" class="form-input" autocomplete="off" placeholder="e.g. mybakery">
                    <div class="requirements" data-i18n="login.storeHiveHelp">Only needed if multiple stores share the same cashier username</div>
                </div>
                <button type="submit" class="submit-btn" id="cashierBtn" data-i18n="login.goToPOS">Go to POS</button>
            </form>

            <!-- Register Form -->
            <form class="form-section" id="registerForm">
                <div class="form-group">
                    <label for="registerUsername" data-i18n="login.usernameLabel">Username</label>
                    <input type="text" id="registerUsername" class="form-input" required autocomplete="username" minlength="3">
                    <div class="requirements" data-i18n="login.minChars3">At least 3 characters</div>
                </div>

                <div class="form-group">
                    <label for="registerHive"><span data-i18n="login.hiveLabel">Hive Account</span> <span style="font-weight:400;color:var(--text-3)" data-i18n="login.hiveOptional">(optional)</span></label>
                    <input type="text" id="registerHive" class="form-input" autocomplete="off" data-i18n-placeholder="login.hivePlaceholder" placeholder="yourhiveaccount">
                </div>

                <div class="form-group">
                    <label for="registerPassword" data-i18n="login.passwordLabel">Password</label>
                    <div class="password-container">
                        <input type="password" id="registerPassword" class="form-input" required autocomplete="new-password" minlength="6">
                        <button type="button" class="password-toggle" data-target="registerPassword">👁️</button>
                    </div>
                    <div class="requirements" data-i18n="login.minChars6">At least 6 characters</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" data-i18n="login.confirmPassword">Confirm Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" class="form-input" required autocomplete="new-password">
                        <button type="button" class="password-toggle" data-target="confirmPassword">👁️</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="registerBtn" data-i18n="login.requestAccess">Request Access</button>
            </form>

            <!-- Language Toggle + Debug Section -->
            <div style="text-align:right;margin-bottom:1rem">
                <span id="langToggleContainer"></span>
            </div>
            <div class="debug-section">
                <div class="debug-header">
                    <h3 data-i18n="login.debugTools">🔧 Debug Tools</h3>
                    <div>
                        <button class="service-status-btn" id="checkServiceBtn" data-i18n="login.checkService">Check Service Status</button>
                        <span class="status-indicator" id="serviceStatus">
                            <span class="status-dot" id="statusDot"></span>
                            <span id="statusText">Unknown</span>
                        </span>
                        <button class="debug-clear" id="clearDebugBtn">Clear</button>
                    </div>
                </div>
                <div class="debug-console" id="debugConsole">
                    <div class="debug-entry">
                        <span class="debug-timestamp">Debug console initialized...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration — set 'pos_api_base' in localStorage to override
        const API_BASE_URL = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';

        document.addEventListener('DOMContentLoaded', () => {
            i18n.init();
            i18n.renderLangToggle(document.getElementById('langToggleContainer'));
        });
        
        // DOM Elements
        const loginToggle    = document.getElementById('loginToggle');
        const cashierToggle  = document.getElementById('cashierToggle');
        const registerToggle = document.getElementById('registerToggle');
        const loginForm    = document.getElementById('loginForm');
        const cashierForm  = document.getElementById('cashierForm');
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loadingMessage = document.getElementById('loadingMessage');

        // Debug Elements
        const checkServiceBtn = document.getElementById('checkServiceBtn');
        const serviceStatus = document.getElementById('serviceStatus');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const debugConsole = document.getElementById('debugConsole');
        const clearDebugBtn = document.getElementById('clearDebugBtn');

        // Toggle between forms
        loginToggle.addEventListener('click',    () => switchForm('login'));
        cashierToggle.addEventListener('click',  () => switchForm('cashier'));
        registerToggle.addEventListener('click', () => switchForm('register'));

        function switchForm(formType) {
            clearMessages();
            [loginToggle, cashierToggle, registerToggle].forEach(b => b.classList.remove('active'));
            [loginForm, cashierForm, registerForm].forEach(f => f.classList.remove('active'));
            if (formType === 'login')    { loginToggle.classList.add('active');    loginForm.classList.add('active'); }
            if (formType === 'cashier')  { cashierToggle.classList.add('active');  cashierForm.classList.add('active'); }
            if (formType === 'register') { registerToggle.classList.add('active'); registerForm.classList.add('active'); }
        }

        // Password toggle functionality
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    button.textContent = '🙈';
                } else {
                    passwordInput.type = 'password';
                    button.textContent = '👁️';
                }
            });
        });

        // Form submission handlers
        loginForm.addEventListener('submit', handleLogin);
        cashierForm.addEventListener('submit', handleCashierLogin);
        registerForm.addEventListener('submit', handleRegister);

        // Password confirmation validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = this.value;
            
            if (confirmPassword && password !== confirmPassword) {
                this.setCustomValidity(t('login.passwordsMismatch'));
            } else {
                this.setCustomValidity('');
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            clearMessages();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                showError(t('login.fillAllFields'));
                return;
            }
            
            setLoading(true);
            
            try {
                const { response, data } = await debugFetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    localStorage.setItem('pos_admin_token', data.token);
                    localStorage.setItem('pos_admin_user', JSON.stringify({
                        username: data.user?.username || username,
                        id: data.user?.id,
                        role: data.user?.role
                    }));

                    showSuccess(t('login.loginSuccess'));

                    setTimeout(() => {
                        window.location.href = data.user?.role === 'superadmin'
                            ? 'superadmin.html'
                            : 'dashboard.html';
                    }, 1000);
                } else {
                    showError(data.error || data.message || t('login.loginFailed'));
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(t('common.networkError'));
            } finally {
                setLoading(false);
            }
        }

        async function handleCashierLogin(e) {
            e.preventDefault();
            clearMessages();

            const username       = document.getElementById('cashierUsername').value.trim();
            const password       = document.getElementById('cashierPassword').value;
            const storeHiveAccount = document.getElementById('cashierStoreHive').value.trim().replace('@', '');

            if (!username || !password) { showError(t('login.fillAllFields')); return; }

            setLoading(true);
            try {
                const { response, data } = await debugFetch(`${API_BASE_URL}/auth/cashier-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, storeHiveAccount: storeHiveAccount || undefined }),
                });

                if (response.ok) {
                    // Save cashier token and store config to localStorage
                    localStorage.setItem('pos_cashier_token', data.token);
                    localStorage.setItem('pos_cashier_user', JSON.stringify({ username: data.cashier.username }));
                    // Seed store config so the POS works immediately
                    if (data.store) {
                        localStorage.setItem('pos_items',    JSON.stringify(data.store.items || []));
                        localStorage.setItem('pos_settings', JSON.stringify({
                            businessName: data.store.businessName || '',
                            bannerUrl:    data.store.bannerUrl || '',
                            categories:   data.store.categories || [],
                            hiveAccount:  data.store.hiveAccount || '',
                            currency:     data.store.currency || 'USD',
                            bitcoinLightningEnabled:  data.store.features?.bitcoinLightning || false,
                            bitcoinLightningConfig:   data.store.bitcoinLightningConfig || {},
                        }));
                        localStorage.setItem('pos_features', JSON.stringify(data.store.features || {}));
                    }
                    showSuccess('Logged in! Opening POS…');
                    setTimeout(() => { window.location.href = 'pos.html'; }, 800);
                } else {
                    showError(data.error || data.message || t('login.loginFailed'));
                }
            } catch (err) {
                showError(t('common.networkError'));
            } finally {
                setLoading(false);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearMessages();

            const username = document.getElementById('registerUsername').value.trim();
            const hiveAccount = document.getElementById('registerHive').value.trim().replace('@', '');
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!username || !password || !confirmPassword) {
                showError(t('login.fillRequired'));
                return;
            }

            if (password !== confirmPassword) {
                showError(t('login.passwordsMismatch'));
                return;
            }

            if (password.length < 6) {
                showError(t('login.passwordMin6'));
                return;
            }

            if (username.length < 3) {
                showError(t('login.usernameMin3'));
                return;
            }

            setLoading(true);

            try {
                const { response, data } = await debugFetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, hiveAccount, password })
                });

                if (response.ok) {
                    showSuccess(t('login.registerSuccess'));
                    registerForm.reset();
                } else {
                    showError(data.error || data.message || t('login.registerFailed'));
                }
            } catch (error) {
                showError(t('common.networkError'));
            } finally {
                setLoading(false);
            }
        }

        // Utility functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function clearMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        function setLoading(loading) {
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            
            if (loading) {
                loadingMessage.classList.add('show');
                loginBtn.disabled = true;
                registerBtn.disabled = true;
            } else {
                loadingMessage.classList.remove('show');
                loginBtn.disabled = false;
                registerBtn.disabled = false;
            }
        }

        // Check if user is already logged in
        function checkAuthStatus() {
            if (localStorage.getItem('pos_admin_token'))   { window.location.href = 'dashboard.html'; return; }
            if (localStorage.getItem('pos_cashier_token')) { window.location.href = 'pos.html'; return; }
        }

        // Forgot password handler (placeholder)
        document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert(t('login.forgotMsg'));
        });

        // Debug event listeners
        checkServiceBtn.addEventListener('click', checkServiceStatus);
        clearDebugBtn.addEventListener('click', clearDebugConsole);

        // Check auth status on page load
        checkAuthStatus();

        // Add some keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                const activeForm = document.querySelector('.form-section.active form');
                if (activeForm) {
                    activeForm.dispatchEvent(new Event('submit'));
                }
            }
        });

        // Service status check (debug feature)
        checkServiceBtn.addEventListener('click', async () => {
            setLoading(true);
            statusText.textContent = 'Checking...';
            statusDot.classList.remove('online', 'offline');
            
            try {
                const response = await fetch(`${API_BASE_URL}/status`);
                const data = await response.json();
                
                if (response.ok) {
                    statusText.textContent = 'Online';
                    statusDot.classList.add('online');
                    logDebug('Service status checked: Online', 'success');
                } else {
                    statusText.textContent = 'Offline';
                    statusDot.classList.add('offline');
                    logDebug('Service status checked: Offline', 'error');
                }
            } catch (error) {
                statusText.textContent = 'Error';
                statusDot.classList.add('offline');
                logDebug('Service status check error', 'error');
            } finally {
                setLoading(false);
            }
        });

        // Debug console logging
        function logDebug(message, type = 'info') {
            const entry = document.createElement('div');
            entry.classList.add('debug-entry');
            
            const timestamp = new Date().toISOString();
            const formattedMessage = `[${timestamp}] ${message}`;
            
            entry.innerHTML = `<span class="debug-timestamp">${formattedMessage}</span>`;
            
            if (type === 'error') {
                entry.innerHTML += ` <span class="debug-status error">ERROR</span>`;
            } else if (type === 'success') {
                entry.innerHTML += ` <span class="debug-status success">SUCCESS</span>`;
            }
            
            debugConsole.appendChild(entry);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        // Clear debug console
        clearDebugBtn.addEventListener('click', () => {
            debugConsole.innerHTML = '';
            logDebug('Debug console cleared');
        });

        // Debug Functions
        function debugLog(method, url, status, response, error = null) {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'debug-entry';
            
            const statusClass = status >= 200 && status < 300 ? 'success' : 'error';
            const statusText = error ? 'ERROR' : status;
            
            entry.innerHTML = `
                <div class="debug-timestamp">[${timestamp}]</div>
                <div><span class="debug-method">${method}</span> <span class="debug-url">${url}</span></div>
                <div>Status: <span class="debug-status ${statusClass}">${statusText}</span></div>
                ${error ? `<div>Error: ${error}</div>` : ''}
                <div>Response: ${JSON.stringify(response, null, 2)}</div>
            `;
            
            debugConsole.appendChild(entry);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        function clearDebugConsole() {
            debugConsole.innerHTML = '<div class="debug-entry"><span class="debug-timestamp">Debug console cleared...</span></div>';
        }

        function updateServiceStatus(isOnline, message) {
            if (isOnline) {
                statusDot.className = 'status-dot online';
                statusText.textContent = 'Online';
            } else {
                statusDot.className = 'status-dot offline';
                statusText.textContent = message || 'Offline';
            }
        }

        // Service Status Check
        async function checkServiceStatus() {
            checkServiceBtn.disabled = true;
            checkServiceBtn.textContent = 'Checking...';
            
            try {
                const startTime = Date.now();
                const response = await fetch(`${API_BASE_URL}/health`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const endTime = Date.now();
                const responseTime = endTime - startTime;
                
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    data = { message: 'Non-JSON response received' };
                }
                
                debugLog('GET', `${API_BASE_URL}/health`, response.status, {
                    ...data,
                    responseTime: `${responseTime}ms`,
                    headers: Object.fromEntries(response.headers.entries())
                });
                
                if (response.ok) {
                    updateServiceStatus(true, `Online (${responseTime}ms)`);
                } else {
                    updateServiceStatus(false, `HTTP ${response.status}`);
                }
                
            } catch (error) {
                debugLog('GET', `${API_BASE_URL}/health`, 0, {}, error.message);
                updateServiceStatus(false, 'Connection Failed');
            } finally {
                checkServiceBtn.disabled = false;
                checkServiceBtn.textContent = 'Check Service Status';
            }
        }

        // Enhanced API call wrapper for debugging
        async function debugFetch(url, options = {}) {
            const method = options.method || 'GET';
            const startTime = Date.now();
            
            try {
                const response = await fetch(url, options);
                const endTime = Date.now();
                const responseTime = endTime - startTime;
                
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    data = await response.text();
                }
                
                debugLog(method, url, response.status, {
                    data,
                    responseTime: `${responseTime}ms`,
                    headers: Object.fromEntries(response.headers.entries())
                });
                
                return { response, data };
            } catch (error) {
                debugLog(method, url, 0, {}, error.message);
                throw error;
            }
        }
    </script>
</body>
