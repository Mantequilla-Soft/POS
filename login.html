<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pangoli Pay</title>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="theme-loader.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 1rem;
        }

        .login-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: var(--sh-lg);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            background: var(--ink);
            color: var(--ink-text);
            text-align: center;
            padding: 2rem 1.5rem 1.5rem;
        }

        .login-header h1 {
            font-size: 2rem;
            margin: 0 0 0.4rem;
            font-weight: 700;
            color: var(--ink-text);
            letter-spacing: -.02em;
        }

        .login-header p {
            opacity: 0.75;
            font-size: 0.9rem;
            color: var(--ink-text);
            margin: 0;
        }

        .form-container {
            padding: 2rem 1.5rem 1.5rem;
        }

        /* ── Tabs ── */
        .form-toggle {
            display: flex;
            margin-bottom: 1.75rem;
            background: var(--surface-2);
            border-radius: var(--r);
            padding: 4px;
            gap: 2px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 8px;
            text-align: center;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: var(--r-sm);
            font-weight: 500;
            font-size: 0.88rem;
            transition: var(--ease);
            color: var(--text-2);
            font-family: var(--font);
        }

        .toggle-btn.active {
            background: var(--ink);
            color: var(--ink-text);
            box-shadow: var(--sh-xs);
        }

        /* ── Inputs ── */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 0.35rem;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--r);
            font-size: 1rem;
            transition: var(--ease);
            background: var(--surface);
            font-family: var(--font);
            color: var(--text);
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--ink);
            box-shadow: 0 0 0 3px rgba(28,25,23,0.07);
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-3);
            font-size: 0.9rem;
            padding: 4px;
        }

        .requirements {
            font-size: 0.78rem;
            color: var(--text-3);
            margin-top: 0.4rem;
            line-height: 1.4;
        }

        /* ── Submit button ── */
        .submit-btn {
            width: 100%;
            padding: 13px;
            background: var(--ink);
            color: var(--ink-text);
            border: none;
            border-radius: var(--r);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--ease);
            margin-top: 0.25rem;
            margin-bottom: 1.25rem;
            font-family: var(--font);
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--ink-hover);
            transform: translateY(-1px);
            box-shadow: var(--sh);
        }

        .submit-btn:disabled {
            background: var(--border);
            color: var(--text-3);
            cursor: not-allowed;
            transform: none;
        }

        /* ── Messages ── */
        .error-message {
            background: var(--red-light);
            color: var(--red);
            padding: 11px 14px;
            border-radius: var(--r);
            margin-bottom: 1rem;
            font-size: 0.88rem;
            border-left: 3px solid var(--red);
            display: none;
        }

        .success-message {
            background: var(--green-light);
            color: var(--green);
            padding: 11px 14px;
            border-radius: var(--r);
            margin-bottom: 1rem;
            font-size: 0.88rem;
            border-left: 3px solid var(--green);
            display: none;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-2);
            font-size: 0.88rem;
            margin-bottom: 0.75rem;
        }

        .loading.show { display: flex; }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid var(--border);
            border-top-color: var(--ink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Form sections ── */
        .form-section { display: none; }
        .form-section.active { display: block; }

        /* ── Forgot password ── */
        .forgot-password {
            text-align: center;
            margin-top: -0.5rem;
            margin-bottom: 0.5rem;
        }

        .forgot-password a {
            color: var(--text-2);
            text-decoration: none;
            font-size: 0.82rem;
        }

        .forgot-password a:hover { color: var(--ink); text-decoration: underline; }

        /* ── Card footer (always visible) ── */
        .card-footer {
            border-top: 1px solid var(--border);
            padding: 1.1rem 1.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            color: var(--text-2);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-full);
            padding: 0.25em 0.75em;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
        }

        .status-dot.online  { background: var(--green, #16a34a); }
        .status-dot.offline { background: var(--red,   #dc2626); }

        /* Register business button */
        .register-business-btn {
            background: none;
            border: 1.5px solid var(--border);
            border-radius: var(--r);
            color: var(--text-2);
            font-size: 0.88rem;
            font-weight: 600;
            font-family: var(--font);
            padding: 0.6rem 1.25rem;
            cursor: pointer;
            transition: var(--ease);
            width: 100%;
        }

        .register-business-btn:hover {
            border-color: var(--ink);
            color: var(--ink);
            background: var(--surface-2);
        }

        /* ── Register overlay (shown instead of tabs when registering) ── */
        #registerSection { display: none; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.82rem;
            color: var(--text-2);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            padding: 0;
            margin-bottom: 1.25rem;
        }
        .back-link:hover { color: var(--ink); }

        /* ── Page footer ── */
        .page-footer {
            font-size: 0.78rem;
            color: var(--text-3);
            text-align: center;
        }

        .page-footer a {
            color: var(--text-2);
            text-decoration: none;
        }

        .page-footer a:hover { text-decoration: underline; }

        /* ── Lang toggle position ── */
        .lang-wrap {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.25rem;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .form-container { padding: 1.5rem 1rem 1rem; }
            .login-header  { padding: 1.5rem 1rem 1rem; }
            .card-footer   { padding: 1rem 1rem 1.1rem; }
        }

        /*
         * ── DEBUG SECTION (commented out — keep for future reference) ──────────
         *
         * .debug-section { ... }
         * .debug-header  { ... }
         * .debug-console { background:#2d3748; color:#e2e8f0; ... }
         * .debug-entry   { ... }
         * .debug-clear   { ... }
         *
         */
    </style>
    <link rel="manifest" href="manifest.json">
    <script src="pwa.js"></script>
</head>
<body>
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <h1>Pangoli Pay</h1>
            <p data-i18n="login.subtitle">Point of Sale</p>
        </div>

        <div class="form-container">
            <!-- Lang toggle -->
            <div class="lang-wrap">
                <span id="langToggleContainer"></span>
            </div>

            <!-- ── Tab toggle (2 tabs only) ── -->
            <div class="form-toggle" id="tabToggle">
                <button class="toggle-btn active" id="cashierToggle" data-i18n="login.tabCashier">Cashier Login</button>
                <button class="toggle-btn"        id="loginToggle"   data-i18n="login.tabLogin">Admin Login</button>
            </div>

            <!-- Feedback -->
            <div class="error-message"   id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <div class="loading"         id="loadingMessage"><div class="spinner"></div></div>

            <!-- ── Normal login content (tabs) ── -->
            <div id="loginContent">
                <!-- Cashier Login (default active) -->
                <div class="form-section active" id="cashierSection">
                    <form id="cashierForm">
                        <div class="form-group">
                            <label for="cashierUsername" data-i18n="login.usernameLabel">Username</label>
                            <input type="text" id="cashierUsername" class="form-input" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="cashierPassword" data-i18n="login.passwordLabel">Password</label>
                            <div class="password-container">
                                <input type="password" id="cashierPassword" class="form-input" required autocomplete="current-password">
                                <button type="button" class="password-toggle" data-target="cashierPassword">👁️</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="cashierStoreHive" data-i18n="login.storeHiveLabel">Store Hive Account <span style="font-weight:400;color:var(--text-3)" data-i18n="login.hiveOptional">(optional)</span></label>
                            <input type="text" id="cashierStoreHive" class="form-input" autocomplete="off">
                            <div class="requirements" data-i18n="login.storeHiveHelp">Only needed if multiple stores share the same cashier username</div>
                        </div>
                        <button type="submit" class="submit-btn" id="cashierBtn" data-i18n="login.goToPOS">Go to POS</button>
                    </form>
                </div>

                <!-- Admin Login -->
                <div class="form-section" id="adminSection">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginUsername" data-i18n="login.usernameLabel">Username</label>
                            <input type="text" id="loginUsername" class="form-input" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="loginPassword" data-i18n="login.passwordLabel">Password</label>
                            <div class="password-container">
                                <input type="password" id="loginPassword" class="form-input" required autocomplete="current-password">
                                <button type="button" class="password-toggle" data-target="loginPassword">👁️</button>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn" id="loginBtn" data-i18n="login.signIn">Sign In</button>
                        <div class="forgot-password">
                            <a href="#" id="forgotPasswordLink" data-i18n="login.forgotPassword">Forgot your password?</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ── Register section (shown when "Register your Business" is clicked) ── -->
            <div id="registerSection">
                <button class="back-link" id="backToLoginBtn" data-i18n="login.backToLogin">← Back to Login</button>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerUsername" data-i18n="login.usernameLabel">Username</label>
                        <input type="text" id="registerUsername" class="form-input" required autocomplete="username" minlength="3">
                        <div class="requirements" data-i18n="login.minChars3">At least 3 characters</div>
                    </div>
                    <div class="form-group">
                        <label for="registerHive"><span data-i18n="login.hiveLabel">Hive Account</span> <span style="font-weight:400;color:var(--text-3)" data-i18n="login.hiveOptional">(optional)</span></label>
                        <input type="text" id="registerHive" class="form-input" autocomplete="off" placeholder="yourhiveaccount">
                    </div>
                    <div class="form-group">
                        <label for="registerPassword" data-i18n="login.passwordLabel">Password</label>
                        <div class="password-container">
                            <input type="password" id="registerPassword" class="form-input" required autocomplete="new-password" minlength="6">
                            <button type="button" class="password-toggle" data-target="registerPassword">👁️</button>
                        </div>
                        <div class="requirements" data-i18n="login.minChars6">At least 6 characters</div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" data-i18n="login.confirmPassword">Confirm Password</label>
                        <div class="password-container">
                            <input type="password" id="confirmPassword" class="form-input" required autocomplete="new-password">
                            <button type="button" class="password-toggle" data-target="confirmPassword">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" id="registerBtn" data-i18n="login.requestAccess">Request Access</button>
                </form>
            </div>
        </div>

        <!-- ── Card footer — always visible ── -->
        <div class="card-footer">
            <!-- System status -->
            <div class="status-pill" id="statusPill">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">…</span>
            </div>

            <!-- Register your Business — always visible, discoverable -->
            <button class="register-business-btn" id="registerBusinessBtn" data-i18n="login.registerBusiness">
                Register your Business
            </button>
        </div>
    </div>

    <!-- Page footer -->
    <p class="page-footer">
        <span data-i18n="login.builtWith">Built with Love by</span>
        <a href="https://snapie.io/@meno" target="_blank" rel="noopener">@meno</a>
    </p>

    <script>
        const API_BASE_URL = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';

        document.addEventListener('DOMContentLoaded', () => {
            i18n.init();
            i18n.renderLangToggle(document.getElementById('langToggleContainer'));
            checkAuthStatus();
            checkServiceStatus();
        });

        // ── DOM refs ────────────────────────────────────────────────────────────
        const cashierToggle = document.getElementById('cashierToggle');
        const loginToggle   = document.getElementById('loginToggle');
        const cashierSection = document.getElementById('cashierSection');
        const adminSection   = document.getElementById('adminSection');
        const loginContent   = document.getElementById('loginContent');
        const registerSection = document.getElementById('registerSection');
        const errorMessage   = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loadingMessage = document.getElementById('loadingMessage');

        // ── Tabs ─────────────────────────────────────────────────────────────
        cashierToggle.addEventListener('click', () => switchTab('cashier'));
        loginToggle.addEventListener('click',   () => switchTab('admin'));

        function switchTab(tab) {
            clearMessages();
            cashierToggle.classList.toggle('active', tab === 'cashier');
            loginToggle.classList.toggle('active',   tab === 'admin');
            cashierSection.classList.toggle('active', tab === 'cashier');
            adminSection.classList.toggle('active',   tab === 'admin');
        }

        // ── Register your Business ────────────────────────────────────────────
        document.getElementById('registerBusinessBtn').addEventListener('click', () => {
            clearMessages();
            loginContent.style.display   = 'none';
            registerSection.style.display = 'block';
            document.getElementById('tabToggle').style.display = 'none';
        });

        document.getElementById('backToLoginBtn').addEventListener('click', () => {
            clearMessages();
            loginContent.style.display    = '';
            registerSection.style.display = 'none';
            document.getElementById('tabToggle').style.display = '';
        });

        // ── Password toggles ─────────────────────────────────────────────────
        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.getAttribute('data-target'));
                const isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                btn.textContent = isHidden ? '🙈' : '👁️';
            });
        });

        // ── Form submissions ─────────────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit',    handleLogin);
        document.getElementById('cashierForm').addEventListener('submit',  handleCashierLogin);
        document.getElementById('registerForm').addEventListener('submit', handleRegister);

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const pw = document.getElementById('registerPassword').value;
            this.setCustomValidity(this.value && pw !== this.value ? t('login.passwordsMismatch') : '');
        });

        async function handleLogin(e) {
            e.preventDefault();
            clearMessages();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) { showError(t('login.fillAllFields')); return; }
            setLoading(true);
            try {
                const { response, data } = await apiFetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                if (response.ok) {
                    localStorage.setItem('pos_admin_token', data.token);
                    localStorage.setItem('pos_admin_user', JSON.stringify({
                        username: data.user?.username || username,
                        id: data.user?.id,
                        role: data.user?.role,
                    }));
                    showSuccess(t('login.loginSuccess'));
                    setTimeout(() => {
                        window.location.href = data.user?.role === 'superadmin' ? 'superadmin.html' : 'dashboard.html';
                    }, 900);
                } else {
                    showError(data.error || data.message || t('login.loginFailed'));
                }
            } catch { showError(t('common.networkError')); }
            finally { setLoading(false); }
        }

        async function handleCashierLogin(e) {
            e.preventDefault();
            clearMessages();
            const username         = document.getElementById('cashierUsername').value.trim();
            const password         = document.getElementById('cashierPassword').value;
            const storeHiveAccount = document.getElementById('cashierStoreHive').value.trim().replace('@', '');
            if (!username || !password) { showError(t('login.fillAllFields')); return; }
            setLoading(true);
            try {
                const { response, data } = await apiFetch(`${API_BASE_URL}/auth/cashier-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, storeHiveAccount: storeHiveAccount || undefined }),
                });
                if (response.ok) {
                    localStorage.setItem('pos_cashier_token', data.token);
                    localStorage.setItem('pos_cashier_user', JSON.stringify({ username: data.cashier.username }));
                    if (data.store) {
                        localStorage.setItem('pos_items',    JSON.stringify(data.store.items || []));
                        localStorage.setItem('pos_settings', JSON.stringify({
                            businessName: data.store.businessName || '',
                            logoUrl:      data.store.logoUrl      || '',
                            bannerUrl:    data.store.bannerUrl    || '',
                            categories:   data.store.categories   || [],
                            hiveAccount:  data.store.hiveAccount  || '',
                            currency:     data.store.currency     || 'USD',
                        }));
                        localStorage.setItem('pos_features', JSON.stringify(data.store.features || {}));
                    }
                    showSuccess(t('login.loginSuccess'));
                    setTimeout(() => { window.location.href = 'pos.html'; }, 800);
                } else {
                    showError(data.error || data.message || t('login.loginFailed'));
                }
            } catch { showError(t('common.networkError')); }
            finally { setLoading(false); }
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearMessages();
            const username        = document.getElementById('registerUsername').value.trim();
            const hiveAccount     = document.getElementById('registerHive').value.trim().replace('@', '');
            const password        = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (!username || !password || !confirmPassword) { showError(t('login.fillRequired')); return; }
            if (password !== confirmPassword) { showError(t('login.passwordsMismatch')); return; }
            if (password.length < 6)  { showError(t('login.passwordMin6'));   return; }
            if (username.length < 3)  { showError(t('login.usernameMin3'));   return; }
            setLoading(true);
            try {
                const { response, data } = await apiFetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, hiveAccount, password }),
                });
                if (response.ok) {
                    showSuccess(t('login.registerSuccess'));
                    document.getElementById('registerForm').reset();
                } else {
                    showError(data.error || data.message || t('login.registerFailed'));
                }
            } catch { showError(t('common.networkError')); }
            finally { setLoading(false); }
        }

        // ── Helpers ───────────────────────────────────────────────────────────
        function showError(msg)   { errorMessage.textContent = msg;   errorMessage.style.display = 'block';   successMessage.style.display = 'none'; }
        function showSuccess(msg) { successMessage.textContent = msg; successMessage.style.display = 'block'; errorMessage.style.display = 'none'; }
        function clearMessages()  { errorMessage.style.display = 'none'; successMessage.style.display = 'none'; }

        function setLoading(on) {
            loadingMessage.classList.toggle('show', on);
            ['loginBtn', 'cashierBtn', 'registerBtn'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = on;
            });
        }

        function checkAuthStatus() {
            if (localStorage.getItem('pos_admin_token'))   { window.location.href = 'dashboard.html'; return; }
            if (localStorage.getItem('pos_cashier_token')) { window.location.href = 'pos.html'; return; }
        }

        document.getElementById('forgotPasswordLink').addEventListener('click', e => {
            e.preventDefault();
            alert(t('login.forgotMsg'));
        });

        // ── Service status (auto-checks on load, no debug window) ─────────────
        async function checkServiceStatus() {
            const dot  = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            try {
                const res = await fetch(`${API_BASE_URL}/health`);
                const online = res.ok;
                dot.className  = 'status-dot ' + (online ? 'online' : 'offline');
                text.textContent = t(online ? 'login.systemOnline' : 'login.systemOffline');
            } catch {
                dot.className  = 'status-dot offline';
                text.textContent = t('login.systemOffline');
            }
        }

        // Lean fetch wrapper — no debug logging
        async function apiFetch(url, options = {}) {
            const response = await fetch(url, options);
            let data;
            try   { data = await response.json(); }
            catch { data = await response.text(); }
            return { response, data };
        }

        /*
         * ── DEBUG CODE (commented out — kept for future reference) ─────────────
         *
         * function debugLog(method, url, status, response, error) { ... }
         * function clearDebugConsole() { ... }
         * function updateServiceStatus(isOnline, message) { ... }
         * async function checkServiceStatusDebug() { ... full debug version ... }
         *
         * To re-enable: restore the .debug-section HTML and replace apiFetch with
         * the original debugFetch wrapper that calls debugLog().
         *
         */
    </script>
</body>
</html>
