<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Reports</title>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="theme.css">
  <script src="theme-loader.js"></script>
    <style>
        body { margin: 0; background: var(--bg); color: var(--text); }
        .page-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .page-header h1 { margin: 0; font-size: 1.2rem; }
        .back-btn { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.85rem; }
        .page-body { padding: 1.5rem; max-width: 960px; margin: 0 auto; }

        /* Filter bar */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: flex-end;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
        }
        .filter-bar label { font-size: 0.78rem; font-weight: 600; color: var(--text-2); display: flex; flex-direction: column; gap: 0.25rem; }
        .filter-bar input[type="date"], .filter-bar select {
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            font-size: 0.875rem;
            background: var(--bg);
            color: var(--text);
        }
        .filter-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-self: flex-end; }
        .filter-actions .btn { margin-top: 0; }

        /* Summary cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 1rem 1.25rem;
            text-align: center;
        }
        .summary-value { font-size: 1.75rem; font-weight: 700; color: var(--text); line-height: 1; margin-bottom: 0.3rem; }
        .summary-label { font-size: 0.72rem; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }

        /* Method breakdown */
        .method-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .method-chip {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-full);
            padding: 0.3rem 0.85rem;
            font-size: 0.8rem;
            display: flex;
            gap: 0.4rem;
        }
        .method-chip .chip-label { color: var(--text-2); }
        .method-chip .chip-val   { font-weight: 600; color: var(--text); }

        /* Sales table */
        .sales-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: var(--bg); color: var(--text-3); font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.65rem 1rem; text-align: left; }
        tbody tr { border-top: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
        tbody tr:hover { background: var(--bg); }
        tbody td { padding: 0.7rem 1rem; font-size: 0.875rem; }
        td.amount { font-weight: 600; }
        .method-badge {
            display: inline-block;
            padding: 0.15rem 0.55rem;
            border-radius: var(--r-full);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .method-hbd           { background: var(--green-light);  color: var(--green); }
        .method-hive          { background: var(--blue-light);   color: var(--blue); }
        .method-cash          { background: var(--amber-light);  color: var(--amber); }
        .method-lightning     { background: #fef9c3; color: #a16207; }
        .method-bank_transfer { background: #dbeafe; color: #1d4ed8; }
        .method-card          { background: #ede9fe; color: #6d28d9; }
        .method-check         { background: #f3f4f6; color: #374151; }
        .method-other         { background: #f3f4f6; color: #374151; }

        /* Expandable row */
        .items-row td { padding: 0 1rem 0.75rem; background: var(--bg); }
        .items-list { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .items-list li { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 0.2rem 0.65rem; font-size: 0.8rem; }

        /* Pagination */
        .pagination { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; }

        /* Empty / loading */
        .state-msg { text-align: center; padding: 3rem 1rem; color: var(--text-3); }

        @media (max-width: 768px) {
            /* Override theme.css column-stacking the page header */
            .page-header { flex-direction: row !important; align-items: center; }
        }
        @media (max-width: 600px) {
            .page-body { padding: 1rem; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar label { width: 100%; }
            .filter-bar input[type="date"],
            .filter-bar select { width: 100%; box-sizing: border-box; }
            .filter-actions { width: 100%; }
            .filter-actions .btn { flex: 1; }
            thead th:nth-child(4), tbody td:nth-child(4) { display: none; }
        }
        @media print {
            .page-header, .filter-bar, .pagination, .back-btn { display: none !important; }
            body { background: #fff; }
            .sales-table-wrap { border: none; }
        }
    </style>
  <link rel="manifest" href="manifest.json">
  <script src="pwa.js"></script>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()" data-i18n="sales.back">← Back</button>
        <h1 data-i18n="sales.pageTitle">Sales Reports</h1>
        <span id="langToggleContainer" style="margin-left:auto"></span>
    </div>

    <div class="page-body">
        <!-- Filter bar -->
        <div class="filter-bar">
            <label><span data-i18n="sales.filterFrom">From</span>
                <input type="date" id="filterFrom">
            </label>
            <label><span data-i18n="sales.filterTo">To</span>
                <input type="date" id="filterTo">
            </label>
            <label><span data-i18n="sales.filterPayment">Payment</span>
                <select id="filterMethod">
                    <option value="" data-i18n="sales.allMethods">All methods</option>
                    <option value="hbd"           data-i18n="pay.method_hbd">HBD (Hive)</option>
                    <option value="cash"          data-i18n="pay.method_cash">Cash</option>
                    <option value="bank_transfer" data-i18n="pay.method_bank_transfer">Bank Transfer</option>
                    <option value="card"          data-i18n="pay.method_card">Credit / Debit Card</option>
                    <option value="check"         data-i18n="pay.method_check">Check</option>
                    <option value="other"         data-i18n="pay.method_other">Other</option>
                    <option value="lightning"     data-i18n="pay.method_lightning">Bitcoin Lightning</option>
                    <option value="hive"          data-i18n="pay.method_hive">HIVE</option>
                </select>
            </label>
            <div class="filter-actions">
                <button class="btn btn-primary" id="applyFilterBtn" data-i18n="sales.apply">Apply</button>
                <button class="btn" id="todayBtn" data-i18n="sales.today">Today</button>
                <button class="btn" id="thisMonthBtn" data-i18n="sales.thisMonth">This Month</button>
            </div>
        </div>

        <!-- Summary -->
        <div class="summary-grid" id="summaryGrid">
            <div class="summary-card"><div class="summary-value" id="sumRevenue">—</div><div class="summary-label" data-i18n="sales.totalRevenue">Total Revenue</div></div>
            <div class="summary-card"><div class="summary-value" id="sumCount">—</div><div class="summary-label" data-i18n="sales.transactions">Transactions</div></div>
            <div class="summary-card"><div class="summary-value" id="sumAvg">—</div><div class="summary-label" data-i18n="sales.avgSale">Avg Sale</div></div>
        </div>
        <div class="method-row" id="methodRow"></div>

        <!-- Sales table -->
        <div class="sales-table-wrap">
            <table id="salesTable">
                <thead>
                    <tr>
                        <th data-i18n="sales.colDate">Date &amp; Time</th>
                        <th data-i18n="sales.colMethod">Method</th>
                        <th data-i18n="sales.colItems">Items</th>
                        <th data-i18n="sales.colFrom">From</th>
                        <th style="text-align:right" data-i18n="sales.colTotal">Total</th>
                    </tr>
                </thead>
                <tbody id="salesBody">
                    <tr><td colspan="5" class="state-msg" data-i18n="sales.selectRange">Select a date range and press Apply.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination" id="paginationRow"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        i18n.init();
        i18n.renderLangToggle(document.getElementById('langToggleContainer'));

        // Default date range: today (local)
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const todayYmd = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
        document.getElementById('filterFrom').value = todayYmd;
        document.getElementById('filterTo').value   = todayYmd;

        loadData(1);
    });

    const API_BASE = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
    const token    = localStorage.getItem('pos_admin_token');
    let currentPage = 1;

    function authHeaders() {
        return { 'Authorization': 'Bearer ' + token };
    }

    document.getElementById('applyFilterBtn').onclick  = () => loadData(1);
    document.getElementById('todayBtn').onclick        = () => setRange(0)  && loadData(1);
    document.getElementById('thisMonthBtn').onclick    = () => setRange('month') && loadData(1);

    function setRange(preset) {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        if (preset === 0) {
            document.getElementById('filterFrom').value = ymd(now);
            document.getElementById('filterTo').value   = ymd(now);
        } else if (preset === 'month') {
            document.getElementById('filterFrom').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
            document.getElementById('filterTo').value   = ymd(now);
        }
        return true;
    }

    async function loadData(page) {
        if (!token) {
            document.getElementById('salesBody').innerHTML =
                `<tr><td colspan="5" class="state-msg">No admin token found. Please log in from the Dashboard first.</td></tr>`;
            return;
        }

        const fromYmd = document.getElementById('filterFrom').value;
        const toYmd   = document.getElementById('filterTo').value;
        const method  = document.getElementById('filterMethod').value;

        // Convert YYYY-MM-DD picker values to local-midnight ISO strings
        function ymdToLocalISO(ymd, end) {
            const [y, m, d] = ymd.split('-').map(Number);
            return end
                ? new Date(y, m - 1, d, 23, 59, 59, 999).toISOString()
                : new Date(y, m - 1, d, 0, 0, 0, 0).toISOString();
        }

        const from = fromYmd ? ymdToLocalISO(fromYmd, false) : '';
        const to   = toYmd   ? ymdToLocalISO(toYmd,   true)  : '';

        const params = new URLSearchParams({ page, limit: 50 });
        if (from)   params.set('from', from);
        if (to)     params.set('to', to);
        if (method) params.set('method', method);

        document.getElementById('salesBody').innerHTML =
            `<tr><td colspan="5" class="state-msg">Loading…</td></tr>`;

        try {
            const [listRes, sumRes] = await Promise.all([
                fetch(`${API_BASE}/sales?${params}`, { headers: authHeaders() }),
                fetch(`${API_BASE}/sales/summary?${new URLSearchParams({ from, to })}`, { headers: authHeaders() }),
            ]);

            if (!listRes.ok || !sumRes.ok) throw new Error('Auth failed or server error');

            const { sales, total, pages } = await listRes.json();
            const summary = await sumRes.json();

            renderSummary(summary);
            renderTable(sales);
            renderPagination(page, pages);
            currentPage = page;
        } catch (err) {
            document.getElementById('salesBody').innerHTML =
                `<tr><td colspan="5" class="state-msg">${t('sales.loadFailed')}</td></tr>`;
        }
    }

    function renderSummary(s) {
        document.getElementById('sumRevenue').textContent = '$' + (s.revenue || 0).toFixed(2);
        document.getElementById('sumCount').textContent   = s.count || 0;
        document.getElementById('sumAvg').textContent     = s.count
            ? '$' + (s.revenue / s.count).toFixed(2) : '$0.00';

        const methodRow = document.getElementById('methodRow');
        methodRow.innerHTML = (s.byMethod || []).map(m =>
            `<div class="method-chip">
                <span class="chip-label">${t('pay.method_' + m._id) || m._id.replace(/_/g,' ').toUpperCase()}</span>
                <span class="chip-val">$${m.revenue.toFixed(2)}</span>
                <span class="chip-label">(${m.count})</span>
            </div>`
        ).join('');
    }

    function renderTable(sales) {
        const tbody = document.getElementById('salesBody');
        if (!sales.length) {
            tbody.innerHTML = `<tr><td colspan="5" class="state-msg">${t('sales.noSales')}</td></tr>`;
            return;
        }
        tbody.innerHTML = sales.map((s, idx) => {
            const dt   = new Date(s.createdAt).toLocaleString();
            const meth = s.paymentMethod;
            const methLabel = meth.replace(/_/g, ' ').toUpperCase();
            const itemsSummary = s.items.map(i => `${i.qty}× ${i.name}`).join(', ');
            const from = s.hiveFrom ? `@${s.hiveFrom}` : '—';
            const notesTooltip = s.paymentNotes ? ` title="${s.paymentNotes.replace(/"/g,'&quot;')}"` : '';
            const proofThumb = s.transferProofUrl
                ? `<a href="${s.transferProofUrl}" target="_blank" title="View transfer proof" style="display:inline-block;margin-top:.25rem">
                    <img src="${s.transferProofUrl}" alt="proof" style="height:36px;width:48px;object-fit:cover;border-radius:3px;border:1px solid var(--border);vertical-align:middle">
                  </a>` : '';
            const transferInfo = (s.transferNote ? `<br><span style="font-size:.72rem;color:var(--text-2)">Ref: ${s.transferNote}</span>` : '') + proofThumb;
            return `
                <tr data-idx="${idx}" onclick="toggleItems(this, ${idx})">
                    <td>${dt}</td>
                    <td><span class="method-badge method-${meth}"${notesTooltip}>${methLabel}</span>${s.paymentNotes ? `<br><span style="font-size:.72rem;color:var(--text-2)">${s.paymentNotes}</span>` : ''}${meth === 'bank_transfer' ? transferInfo : ''}</td>
                    <td style="color:var(--text-2);font-size:0.8rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${itemsSummary}</td>
                    <td style="color:var(--text-2);font-size:0.8rem">${from}</td>
                    <td class="amount" style="text-align:right">$${s.total.toFixed(2)}</td>
                </tr>
                <tr class="items-row" id="items-${idx}" style="display:none">
                    <td colspan="5">
                        <ul class="items-list">
                            ${s.items.map(i => `<li>${i.qty}× ${i.name} — $${(i.price*i.qty).toFixed(2)}</li>`).join('')}
                        </ul>
                    </td>
                </tr>`;
        }).join('');

        // store sales for printing
        window._salesData = sales;
    }

    function toggleItems(row, idx) {
        const detailRow = document.getElementById('items-' + idx);
        detailRow.style.display = detailRow.style.display === 'none' ? '' : 'none';
    }

    function renderPagination(page, pages) {
        const el = document.getElementById('paginationRow');
        if (pages <= 1) { el.innerHTML = ''; return; }
        let html = '';
        if (page > 1) html += `<button class="btn btn-sm" onclick="loadData(${page-1})">← Prev</button>`;
        html += `<span style="padding:0.4rem 0.75rem;font-size:0.85rem;color:var(--text-2)">Page ${page} of ${pages}</span>`;
        if (page < pages) html += `<button class="btn btn-sm" onclick="loadData(${page+1})">Next →</button>`;
        el.innerHTML = html;
    }
    </script>
</body>
</html>
