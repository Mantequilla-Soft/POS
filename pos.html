<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point of Sale</title>
    <script src="i18n.js"></script>
    <meta name="theme-color" content="#b5651d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hive POS">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/sweetplace logo.png">
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ── POS page layout ── */
        body { margin: 0; }

        .pos-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg);
        }

        /* Top bar */
        .pos-topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 40;
        }
        /* On mobile: secondary items drop to a second row */
        .pos-topbar-secondary {
            display: contents; /* transparent on desktop — items stay in the main row */
        }
        @media (max-width: 640px) {
            .pos-topbar { padding: 0.6rem 1rem; gap: 0.5rem; }
            .pos-topbar-secondary {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex-wrap: wrap;
                width: 100%;
                order: 10;
            }
            #bannerContainer { display: none !important; }
            #logoutBtn { margin-left: auto !important; }
        }
        .pos-biz-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pos-hive-badge {
            font-size: 0.8rem;
            color: var(--text-2);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r-full);
            padding: 0.3em 0.8em;
            white-space: nowrap;
        }
        /* Banner */
        #bannerContainer img {
            max-height: 90px;
            border-radius: var(--r);
        }

        /* Body: catalog + cart */
        .pos-body {
            display: flex;
            flex: 1;
            gap: 0;
            overflow: hidden;
        }

        /* Catalog (left) */
        .pos-catalog {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.875rem;
        }

        /* Cart (right panel) */
        .pos-cart-panel {
            width: 300px;
            flex-shrink: 0;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .cart-head {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .cart-head h2 { font-size: 1rem; font-weight: 600; }

        .cart-body {
            flex: 1;
            overflow-y: auto;
        }
        .cart-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .cart-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 0.5rem;
            font-size: 0.875rem;
        }
        .cart-item-name { font-weight: 500; color: var(--text); flex: 1; min-width: 0; }
        .cart-item-qty  { display: flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
        .cart-item-price { font-weight: 600; color: var(--text); flex-shrink: 0; min-width: 52px; text-align: right; }

        .qty-btn {
            width: 24px; height: 24px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            background: var(--bg);
            color: var(--text);
            font-size: 0.875rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--ease);
            flex-shrink: 0;
        }
        .qty-btn:hover { background: var(--border); }
        .qty-num { font-size: 0.85rem; font-weight: 600; min-width: 18px; text-align: center; }

        .remove-btn {
            width: 24px; height: 24px;
            border: none;
            border-radius: var(--r-sm);
            background: var(--red-light);
            color: var(--red);
            font-size: 0.8rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--ease);
            flex-shrink: 0;
        }
        .remove-btn:hover { background: var(--red); color: #fff; }

        .cart-empty {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-3);
            font-size: 0.875rem;
        }

        .cart-foot {
            border-top: 1px solid var(--border);
            padding: 1rem 1.25rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .cart-total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        /* QR / payment overlay */
        #qrInlineContainer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(28,25,23,0.45);
            backdrop-filter: blur(3px);
            z-index: 800;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        #qrInlineContainer.open { display: flex; }

        /* Post-sale row */
        #postSaleRow {
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 1.25rem;
            box-shadow: var(--sh-lg);
            max-width: 380px;
            width: 100%;
        }

        /* Mobile: stack catalog above cart */
        @media (max-width: 768px) {
            .pos-body { flex-direction: column; overflow: visible; }
            .pos-cart-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
            .pos-catalog { padding: 1rem; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.625rem; }
        }
    </style>
  <script src="pwa.js"></script>
</head>
<body>
<div class="pos-page">
    <!-- Top bar -->
    <header class="pos-topbar">
        <span id="businessNameHeader" class="pos-biz-name">Point of Sale</span>
        <span id="langToggleContainer"></span>
        <button id="logoutBtn" class="btn btn-secondary btn-sm" data-i18n="common.logout" style="margin-left:auto;min-width:72px;">Logout</button>
        <div class="pos-topbar-secondary">
            <div id="bannerContainer"></div>
            <div id="hiveAccountDisplay" class="pos-hive-badge" style="display:none;"></div>
            <div id="cashierBadge" style="display:none;font-size:0.8rem;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-full);padding:0.2rem 0.7rem;"></div>
            <a href="members.html" id="membersLinkBtn" class="btn btn-secondary btn-sm" style="display:none;text-decoration:none">👥 Members</a>
        </div>
    </header>

    <!-- Main body -->
    <div class="pos-body">
        <!-- Product catalog -->
        <main class="pos-catalog">
            <div class="filter-pills" id="categoryTabs"></div>
            <div class="product-grid" id="menuList"></div>
        </main>

        <!-- Cart panel -->
        <aside class="pos-cart-panel">
            <div class="cart-head">
                <h2>Cart</h2>
                <button id="clearCartBtn" class="btn btn-ghost btn-sm" title="Clear Cart">🗑</button>
            </div>
            <div class="cart-body" id="cart">
                <ul class="cart-list" id="cartList"></ul>
            </div>
            <div class="cart-foot" id="cartFoot">
                <div class="cart-total" id="cartTotal">Total: $0.00</div>
            </div>
        </aside>
    </div>

    <!-- QR / payment overlay -->
    <div id="qrInlineContainer"></div>
</div>
    <!-- Add QR code library if not already present -->
    <script>
    if (!window.QRCode) {
        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        document.head.appendChild(script);
    }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            i18n.init();
            i18n.renderLangToggle(document.getElementById('langToggleContainer'));
        });
        // --- Bitcoin Lightning minimum amount check ---
        function isLightningAmountValid(amount, currency) {
            // Accept both 'USD' and 'usd' for safety
            return !(currency === 'USD' || currency === 'usd') || parseFloat(amount) >= 0.25;
        }
        // Load items from localStorage
        function getItems() {
            return JSON.parse(localStorage.getItem('pos_items') || '[]');
        }
        // --- Banner and Business Name Logic ---
        function getStoreSettings() {
            return JSON.parse(localStorage.getItem('pos_settings') || '{"businessName":"","bannerUrl":"","categories":["drink","pastry","bread","other"],"hiveAccount":""}');
        }
        function renderBannerAndName() {
            const settings = getStoreSettings();
            // Banner
            const bannerDiv = document.getElementById('bannerContainer');
            bannerDiv.innerHTML = settings.bannerUrl ? `<img src="${settings.bannerUrl}" alt="Banner" style="max-width:100%;max-height:120px;border-radius:8px;">` : '';
            // Business Name
            document.getElementById('businessNameHeader').textContent = settings.businessName || t('pos.title');
            // Cashier badge
            const cashierUser = JSON.parse(localStorage.getItem('pos_cashier_user') || 'null');
            const cashierBadge = document.getElementById('cashierBadge');
            if (cashierUser?.username) {
                cashierBadge.textContent = '👤 ' + cashierUser.username;
                cashierBadge.style.display = '';
            }
            // Members link (visible when the store has memberships enabled)
            const features = JSON.parse(localStorage.getItem('pos_features') || '{}');
            if (features.memberships) {
                document.getElementById('membersLinkBtn').style.display = '';
            }
        }
        // --- Category Tabs Logic (updated to use store settings) ---
        function getCategories(items) {
            const settings = getStoreSettings();
            // Only show categories that exist in store settings
            return (settings.categories || []).filter(cat => items.some(item => item.category === cat));
        }
        let currentCategory = 'all';
        function renderCategoryTabs(items) {
            const cats = getCategories(items);
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = '';
            // All pill
            const allBtn = document.createElement('button');
            allBtn.className = 'pill' + (currentCategory === 'all' ? ' active' : '');
            allBtn.innerHTML = `${t('pos.all')} <span class="pill-count">${items.length}</span>`;
            allBtn.onclick = () => { currentCategory = 'all'; renderMenu(); };
            tabs.appendChild(allBtn);
            // Category pills
            cats.forEach(cat => {
                const count = items.filter(i => i.category === cat).length;
                const btn = document.createElement('button');
                btn.className = 'pill' + (currentCategory === cat ? ' active' : '');
                btn.innerHTML = `${cat.charAt(0).toUpperCase() + cat.slice(1)} <span class="pill-count">${count}</span>`;
                btn.onclick = () => { currentCategory = cat; renderMenu(); };
                tabs.appendChild(btn);
            });
        }
        // Render menu
        function renderMenu() {
            renderBannerAndName();
            renderHiveAccount();
            const items = getItems();
            renderCategoryTabs(items);
            const menu = document.getElementById('menuList');
            menu.innerHTML = '';
            const filtered = currentCategory === 'all' ? items : items.filter(i => i.category === currentCategory);
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'product-card';
                const initial = item.name.charAt(0).toUpperCase();
                div.innerHTML = `
                    <div class="product-thumb">
                        ${item.image ? `<img src="${item.image}" alt="${item.name}">` : `<span class="product-initial">${initial}</span>`}
                    </div>
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">$${item.price.toFixed(2)}</div>
                    </div>
                `;
                div.onclick = () => addToCart(item);
                menu.appendChild(div);
            });
        }
        // Cart logic
        let cart = [];
        function addToCart(item) {
            // Check if item already in cart
            const found = cart.find(ci => ci.id === item.id);
            if (found) {
                found.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            renderCart();
        }
        function renderCart() {
            const list = document.getElementById('cartList');
            list.innerHTML = '';
            if (cart.length === 0) {
                list.innerHTML = '<div class="cart-empty">No items yet</div>';
            } else {
                cart.forEach((item, idx) => {
                    const lineTotal = item.price * item.qty;
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span class="cart-item-name">${item.name}</span>
                        <span class="cart-item-qty">
                            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                            <button class="remove-btn" onclick="removeFromCart(${idx})">✕</button>
                        </span>
                        <span class="cart-item-price">$${lineTotal.toFixed(2)}</span>
                    `;
                    list.appendChild(li);
                });
            }
            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            document.getElementById('cartTotal').textContent = t('pos.total', { amount: total.toFixed(2) });
        }
        function renderHiveAccount() {
            const settings = getStoreSettings();
            const hiveDiv = document.getElementById('hiveAccountDisplay');
            if (settings.hiveAccount) {
                hiveDiv.textContent = `@${settings.hiveAccount}`;
                hiveDiv.style.display = '';
            } else {
                hiveDiv.textContent = '';
                hiveDiv.style.display = 'none';
            }
        }
        // QR Inline logic
        function showQrInline() {
            const settings = getStoreSettings();
            const hiveAccount = settings.hiveAccount;
            if (!hiveAccount) {
                alert(t('pos.noHiveAccount'));
                return;
            }
            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            if (total <= 0) {
                alert('Cart is empty.');
                return;
            }
            // Prepare memo: use current system time (ISO string)
            const memoDecoded = new Date().toISOString();
            window.lastPaymentMemo = memoDecoded; // Save for listener
            window.lastPaymentAmount = `${total.toFixed(3)} HBD`;
            const op = [
              "transfer",
              {
                to: hiveAccount,
                amount: `${total.toFixed(3)} HBD`,
                memo: memoDecoded
              }
            ];
            const json = JSON.stringify(op);
            const base64 = btoa(json)
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=+$/, "");
            const uri = `hive://sign/op/${base64}`;

            // Generate QR code
            const qrDiv = document.getElementById('qrInlineContainer');
            qrDiv.innerHTML = `<div style='background:var(--surface);padding:2rem 1.5rem;border-radius:var(--r-xl);box-shadow:var(--sh-lg);display:flex;flex-direction:column;align-items:center;max-width:360px;width:100%;'>
                <h2 style='margin:0 0 1.25rem;text-align:center;font-size:1.1rem;'>${t('pos.scanToPay')}</h2>
                <div id='qrCodeInline' style='margin-bottom:1.25rem;min-height:240px;display:flex;align-items:center;justify-content:center;'></div>
                <div style='font-size:0.95rem;margin-bottom:1rem;text-align:center;color:var(--text-2);line-height:1.6;'><b style="color:var(--text);">To:</b> @${hiveAccount}<br><b style="color:var(--text);">Amount:</b> ${total.toFixed(3)} HBD</div>
                <div style='word-break:break-all;font-size:0.78rem;background:var(--bg);padding:0.6em 0.8em;border-radius:var(--r);text-align:center;color:var(--text-3);border:1px solid var(--border);width:100%;'>${uri}</div>
                <div id='paymentStatus' style='margin-top:1rem;font-size:0.95rem;font-weight:500;color:var(--green);text-align:center;'></div>
            </div>`;
            qrDiv.classList.add('open');
            setTimeout(() => {
                const qrCodeDiv = document.getElementById('qrCodeInline');
                qrCodeDiv.innerHTML = '';
                if (window.QRCode) {
                    new QRCode(qrCodeDiv, {
                        text: uri,
                        width: 240,
                        height: 240,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } else {
                    qrCodeDiv.textContent = t('pos.qrLibMissing');
                }
            }, 0);
            // Start payment listener
            startPaymentListener();
        }

        // --- Payment Listener ---
        let paymentListenerInterval = null;
        function startPaymentListener() {
            if (paymentListenerInterval) clearInterval(paymentListenerInterval);
            const settings = getStoreSettings();
            const hiveAccount = settings.hiveAccount;
            const expectedAmount = window.lastPaymentAmount;
            const expectedMemo = window.lastPaymentMemo;
            const statusDiv = document.getElementById('paymentStatus');
            let attempts = 0;
            paymentListenerInterval = setInterval(async function() {
                attempts++;
                if (!hiveAccount || !expectedAmount || !expectedMemo) return;
                try {
                    const response = await fetch('https://api.hive.blog', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            jsonrpc: '2.0',
                            method: 'condenser_api.get_account_history',
                            params: [hiveAccount, -1, 20],
                            id: 1
                        })
                    });
                    const data = await response.json();
                    const history = data.result;
                    for (let i = history.length - 1; i >= 0; i--) {
                        const op = history[i][1].op;
                        if (op[0] === 'transfer' &&
                            op[1].to === hiveAccount &&
                            op[1].amount === expectedAmount &&
                            op[1].memo === expectedMemo) {
                            statusDiv.textContent = t('pos.paymentReceived');
                            clearInterval(paymentListenerInterval);
                            paymentListenerInterval = null;
                            // Show post-sale actions for HBD
                            const saleCart = cart.map(i => ({...i}));
                            const saleTotal = saleCart.reduce((sum, i) => sum + i.price * i.qty, 0);
                            cart = [];
                            renderCart();
                            renderMenu();
                            showPostSaleActions('hbd', saleCart, saleTotal, op[1].from, op[1].memo);
                            return;
                        }
                    }
                    statusDiv.textContent = t('pos.waitingPayment');
                } catch (e) {
                    statusDiv.textContent = t('pos.paymentError');
                }
                if (attempts > 100) {
                    statusDiv.textContent = t('pos.paymentTimeout');
                    clearInterval(paymentListenerInterval);
                    paymentListenerInterval = null;
                }
            }, 3000);
        }
        // --- Payment Buttons ---
        function isBitcoinLightningEnabled() {
            const settings = getStoreSettings();
            return !!settings.bitcoinLightningEnabled && settings.bitcoinLightningConfig;
        }
        function getCartHasItems() {
            return cart && cart.length > 0;
        }
        function renderPaymentButtons() {
            const cartFoot = document.getElementById('cartFoot');
            ['paymentButtonsRow', 'cashPaymentSection', 'externalPaymentSection'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.remove();
            });
            const cartHasItems = getCartHasItems();
            const dis = cartHasItems ? '' : 'disabled';
            let html = `<div id="paymentButtonsRow" style="display:flex;flex-direction:column;gap:0.5rem;">`;
            // Primary row: HBD + Cash
            html += `<div style="display:flex;gap:0.5rem;">`;
            html += `<button id="payWithHbdBtn" type="button" class="btn btn-success" style="flex:1;" ${dis}>${t('pos.payHbd')}</button>`;
            html += `<button id="payWithCashBtn" type="button" class="btn" style="flex:1;background:var(--amber);color:#fff;border-color:var(--amber);" ${dis}>${t('pos.payCash')}</button>`;
            html += `</div>`;
            // Secondary row: Card + Bank Transfer
            html += `<div style="display:flex;gap:0.5rem;">`;
            html += `<button id="payWithCardBtn" type="button" class="btn btn-secondary" style="flex:1;" ${dis}>${t('pos.payCard')}</button>`;
            html += `<button id="payWithBankBtn" type="button" class="btn btn-secondary" style="flex:1;" ${dis}>${t('pos.payBankTransfer')}</button>`;
            html += `</div>`;
            // Third row: Check + Other
            html += `<div style="display:flex;gap:0.5rem;">`;
            html += `<button id="payWithCheckBtn" type="button" class="btn btn-secondary" style="flex:1;" ${dis}>${t('pos.payCheck')}</button>`;
            html += `<button id="payWithOtherBtn" type="button" class="btn btn-secondary" style="flex:1;" ${dis}>${t('pos.payOther')}</button>`;
            html += `</div>`;
            if (isBitcoinLightningEnabled()) {
                html += `<button id="payWithBtcBtn" type="button" class="btn btn-block" style="background:#f7931a;color:#fff;border-color:#f7931a;" ${dis}>${t('pos.payBtc')}</button>`;
            }
            html += `</div>`;
            // Cash section (change calculator)
            html += `<div id="cashPaymentSection" style="display:none;padding-top:0.75rem;">
                <div class="form-group">
                    <label for="cashGivenInput">${t('pos.cashGiven')}</label>
                    <input id="cashGivenInput" type="number" min="0" step="0.01" />
                </div>
                <div id="changeDueDisplay" style="font-size:1rem;font-weight:600;margin-bottom:0.75rem;min-height:1.5em;"></div>
                <button id="finishCashSaleBtn" class="btn btn-success btn-block">${t('pos.finishSale')}</button>
            </div>`;
            // External payment section (card / bank transfer / check / other)
            html += `<div id="externalPaymentSection" style="display:none;padding-top:0.75rem;">
                <div class="form-group" id="externalNotesGroup">
                    <label id="externalNotesLabel">${t('pos.paymentNotesLabel')}</label>
                    <input id="externalNotesInput" type="text" placeholder="" />
                </div>
                <button id="finishExternalSaleBtn" class="btn btn-success btn-block">${t('pos.finishSale')}</button>
            </div>`;
            cartFoot.insertAdjacentHTML('beforeend', html);
        }
        function setupPaymentButtons() {
            renderPaymentButtons();
            const payWithCashBtn   = document.getElementById('payWithCashBtn');
            const payWithHbdBtn    = document.getElementById('payWithHbdBtn');
            const payWithBtcBtn    = document.getElementById('payWithBtcBtn');
            const payWithCardBtn   = document.getElementById('payWithCardBtn');
            const payWithBankBtn   = document.getElementById('payWithBankBtn');
            const payWithCheckBtn  = document.getElementById('payWithCheckBtn');
            const payWithOtherBtn  = document.getElementById('payWithOtherBtn');
            const qrInline         = document.getElementById('qrInlineContainer');
            const cashSection      = document.getElementById('cashPaymentSection');
            const externalSection  = document.getElementById('externalPaymentSection');
            const cashInput        = document.getElementById('cashGivenInput');
            const changeDue        = document.getElementById('changeDueDisplay');
            const finishBtn        = document.getElementById('finishCashSaleBtn');
            const finishExtBtn     = document.getElementById('finishExternalSaleBtn');
            const extNotesInput    = document.getElementById('externalNotesInput');
            const extNotesLabel    = document.getElementById('externalNotesLabel');
            let currentExternalMethod = '';

            function getTotal() {
                return cart.reduce(function(sum, item) { return sum + item.price * item.qty; }, 0);
            }
            function hideAllSections() {
                qrInline.classList.remove('open');
                cashSection.style.display = 'none';
                externalSection.style.display = 'none';
            }
            function showKeychain() {
                hideAllSections();
                qrInline.classList.add('open');
            }
            function showCash() {
                hideAllSections();
                cashSection.style.display = 'block';
                cashInput.value = '';
                changeDue.textContent = '';
            }
            function showExternal(method) {
                hideAllSections();
                currentExternalMethod = method;
                const isOther = method === 'other';
                extNotesLabel.textContent = t('pos.paymentNotesLabel') + (isOther ? ' *' : '');
                extNotesInput.value = '';
                extNotesInput.placeholder = isOther ? t('pos.paymentNotesRequired') : t('pay.notesPlaceholder');
                externalSection.style.display = 'block';
                extNotesInput.focus();
            }
            if (payWithCashBtn)  payWithCashBtn.onclick  = showCash;
            if (payWithCardBtn)  payWithCardBtn.onclick  = () => showExternal('card');
            if (payWithBankBtn)  payWithBankBtn.onclick  = () => showExternal('bank_transfer');
            if (payWithCheckBtn) payWithCheckBtn.onclick = () => showExternal('check');
            if (payWithOtherBtn) payWithOtherBtn.onclick = () => showExternal('other');
            if (payWithHbdBtn) payWithHbdBtn.onclick = function() {
                showKeychain();
                showQrInline();
            };
            if (payWithBtcBtn) payWithBtcBtn.onclick = async function() {
                // Get config
                const settings = getStoreSettings();
                const bl = settings.bitcoinLightningConfig;
                if (!bl) {
                    alert(t('pos.lightningMissing'));
                    return;
                }
                // Calculate total in USD (or use POS currency logic if needed)
                const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
                if (!total || total <= 0) {
                    alert(t('pos.cartEmpty'));
                    return;
                }
                const currency = bl.currency || 'USD';
                if (!isLightningAmountValid(total, currency)) {
                    alert(t('pos.lightningMin'));
                    return;
                }
                // --- Generate short memo BEFORE invoice creation ---
                const shortMemo = `HivePOS-${Math.floor(Math.random()*9000+1000)}`; // 4 random digits for uniqueness
                window.lastLightningMemo = shortMemo;
                // Show modal and loading state
                const modal = document.getElementById('btcLightningQrModal');
                modal.style.display = 'flex';
                document.getElementById('btcLightningQrAccount').textContent = t('pos.lightningReceiving', { account: bl.hive_accname || '' });
                document.getElementById('btcLightningInvoice').textContent = t('pos.requestingInvoice');
                const qrDiv = document.getElementById('btcLightningQrCode');
                qrDiv.innerHTML = '';
                // Build API call WITH message (memo) set
                const params = new URLSearchParams({
                    hive_accname: bl.hive_accname,
                    amount: total.toFixed(2),
                    currency: bl.currency,
                    receive_currency: bl.receive_currency,
                    usd_hbd: 'false',
                    app_name: bl.app_name,
                    expiry: bl.expiry,
                    message: shortMemo,
                    qr_code: bl.qr_code
                });
                const url = `https://api.v4v.app/v1/new_invoice_hive?${params.toString()}`;
                try {
                    const res = await fetch(url, { headers: { 'accept': 'application/json' } });
                    if (!res.ok) throw new Error('API error: ' + res.status);
                    const data = await res.json();
                    if (data.payment_request) {
                        document.getElementById('btcLightningInvoice').textContent = data.payment_request;
                        qrDiv.innerHTML = '';
                        if (window.QRCode) {
                            new QRCode(qrDiv, {
                                text: data.payment_request,
                                width: 220,
                                height: 220,
                                colorDark: '#000',
                                colorLight: '#fff',
                                correctLevel: window.QRCode.CorrectLevel.H
                            });
                        } else {
                            qrDiv.textContent = 'QR code library not loaded.';
                        }
                        // Start Lightning payment listener using the short memo
                        startLightningPaymentListener(shortMemo);
                    } else {
                        document.getElementById('btcLightningInvoice').textContent = t('pos.noInvoice');
                        qrDiv.innerHTML = '';
                    }
                } catch (err) {
                    document.getElementById('btcLightningInvoice').textContent = 'Error: ' + err.message;
                    qrDiv.innerHTML = '';
                }
            };
            if (cashInput) {
                cashInput.oninput = function() {
                    var given = parseFloat(cashInput.value);
                    var total = getTotal();
                    if (isNaN(given)) { changeDue.textContent = ''; return; }
                    var change = given - total;
                    changeDue.textContent = (change >= 0) ? t('pos.changeDue', { amount: change.toFixed(2) }) : t('pos.notEnoughCash');
                };
            }
            if (finishBtn) {
                finishBtn.onclick = function() {
                    const saleCart = cart.map(i => ({...i}));
                    const saleTotal = saleCart.reduce((sum, i) => sum + i.price * i.qty, 0);
                    cart = [];
                    renderCart();
                    renderMenu();
                    showPostSaleActions('cash', saleCart, saleTotal);
                };
            }
            if (finishExtBtn) {
                finishExtBtn.onclick = function() {
                    if (currentExternalMethod === 'other' && !extNotesInput.value.trim()) {
                        alert(t('pos.paymentNotesRequired'));
                        extNotesInput.focus();
                        return;
                    }
                    const saleCart = cart.map(i => ({...i}));
                    const saleTotal = saleCart.reduce((sum, i) => sum + i.price * i.qty, 0);
                    const notes = extNotesInput.value.trim();
                    cart = [];
                    renderCart();
                    renderMenu();
                    showPostSaleActions(currentExternalMethod, saleCart, saleTotal, null, null, notes);
                };
            }
            // QR overlay stays hidden until the user clicks "Pay with HBD"
        }
        // --- Initial Render ---
        // Always fetch fresh store data from the backend on load — backend is the single source of truth.
        // Both owner and cashier tokens work; localStorage is just a fallback when offline.
        async function initStoreData() {
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            if (token) {
                try {
                    const API_BASE = localStorage.getItem('pos_api_base') || window.location.origin;
                    const res = await fetch(`${API_BASE}/api/store`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const store = await res.json();
                        localStorage.setItem('pos_items', JSON.stringify(store.items || []));
                        localStorage.setItem('pos_settings', JSON.stringify({
                            businessName: store.businessName || '',
                            bannerUrl: store.bannerUrl || '',
                            categories: store.categories || [],
                            hiveAccount: store.hiveAccount || '',
                            currency: store.currency || 'HBD',
                        }));
                        localStorage.setItem('pos_features', JSON.stringify(store.features || {}));
                    }
                } catch (e) {
                    // Network error — fall back to whatever is in localStorage
                }
            }
            renderMenu();
            renderCart();
            renderHiveAccount();
            setupPaymentButtons();
        }
        initStoreData();

        // Logout — clears only the relevant token, keeps the other role's session intact
        document.getElementById('logoutBtn').onclick = function() {
            if (localStorage.getItem('pos_cashier_token')) {
                localStorage.removeItem('pos_cashier_token');
                localStorage.removeItem('pos_cashier_user');
            } else {
                localStorage.removeItem('pos_admin_token');
            }
            window.location.href = 'login.html';
        };

        // Attach to pay button
        const payBtn = document.querySelector('.pay-btn');
        if (payBtn) payBtn.onclick = showQrInline;
        // Remove old payment mode tabs if present
        var oldTabs = document.getElementById('paymentModeTabs');
        if (oldTabs) oldTabs.remove();
        var oldCashSection = document.querySelectorAll('#cashPaymentSection');
        if (oldCashSection.length > 1) {
          for (var i = 1; i < oldCashSection.length; i++) {
            oldCashSection[i].remove();
          }
        }
        // Call setupPaymentButtons after renderMenu and renderCart
        const originalRenderMenu = renderMenu;
        renderMenu = function() {
            originalRenderMenu();
            setupPaymentButtons();
        };
        const originalRenderCart = renderCart;
        renderCart = function() {
            originalRenderCart();
            setupPaymentButtons();
        };
        function changeQty(idx, delta) {
            if (cart[idx]) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) {
                    cart.splice(idx, 1);
                }
                renderCart();
            }
        }
        function removeFromCart(idx) {
            cart.splice(idx, 1);
            renderCart();
        }
        // Expose cart functions to global scope for inline button handlers
        window.changeQty = changeQty;
        window.removeFromCart = removeFromCart;
        // Attach clear cart button logic
        const clearCartBtn = document.getElementById('clearCartBtn');
        if (clearCartBtn) {
            clearCartBtn.onclick = function() {
                if (cart.length === 0) return;
                if (confirm(t('pos.clearCartConfirm'))) {
                    cart = [];
                    renderCart();
                    // Also hide QR/cash sections if visible
                    document.getElementById('qrInlineContainer').classList.remove('open');
                    var cashSection = document.getElementById('cashPaymentSection');
                    if (cashSection) cashSection.style.display = 'none';
                }
            };
        }
        // --- Post-Sale Actions ---
        async function showPostSaleActions(paymentType, saleCart, saleTotal, hiveFrom, txId, paymentNotes) {
            document.getElementById('qrInlineContainer').classList.remove('open');

            // Auto-save sale to backend (works for both admin and cashier tokens)
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            const apiBase = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
            let savedToBackend = false;
            if (token) {
                try {
                    const saleRes = await fetch(`${apiBase}/sales`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({
                            items: saleCart.map(i => ({ id: i.id, name: i.name, category: i.category, price: i.price, qty: i.qty })),
                            total: saleTotal,
                            currency: (getStoreSettings().currency || 'HBD'),
                            paymentMethod: paymentType.toLowerCase(),
                            paymentNotes: paymentNotes || '',
                            hiveFrom: hiveFrom || null,
                            hiveTransactionId: txId || null,
                            cashier: JSON.parse(localStorage.getItem('pos_cashier_user') || 'null')?.username || null,
                        }),
                    });
                    if (saleRes.ok) {
                        savedToBackend = true;
                    } else {
                        const errBody = await saleRes.json().catch(() => ({}));
                        console.error('Sale not saved:', saleRes.status, errBody);
                    }
                } catch (err) {
                    console.error('Sale save network error:', err);
                }
            }

            const cartFoot = document.getElementById('cartFoot');
            cartFoot.innerHTML = `
                <div style="text-align:center;padding:0.25rem 0 0.75rem;color:var(--green);font-weight:600;font-size:0.9rem;">✓ ${t('pos.saleComplete')}</div>
                <div id="postSaleActionsRow" style="display:flex;flex-direction:column;gap:0.5rem;">
                    <button id="postSalePrintBtn" class="btn btn-secondary btn-block">${t('pos.printReceipt')}</button>
                    <button id="postSaleNewBtn" class="btn btn-success btn-block">${t('common.newSale')}</button>
                </div>`;

            document.getElementById('postSalePrintBtn').onclick = function() {
                const now = new Date();
                const settings = getStoreSettings();
                const w = window.open('', '_blank', 'width=400,height=600');
                w.document.write(`
                    <html><head><title>Receipt</title>
                    <style>body{font-family:monospace;font-size:12px;padding:1em;width:58mm}
                    h2{font-size:13px;margin:0 0 .5em}table{width:100%;border-collapse:collapse}
                    td,th{font-size:11px;padding:2px 4px}tfoot td{border-top:1px solid #000;font-weight:bold}
                    @media print{button{display:none}}</style></head><body>
                    <h2>${settings.businessName || 'HIVE POS'}</h2>
                    <p style="margin:0;font-size:11px">${now.toLocaleString()}<br>Payment: ${paymentType.toUpperCase()}${hiveFrom ? '<br>From: @' + hiveFrom : ''}</p>
                    <table><thead><tr><th align="left">Item</th><th>Qty</th><th align="right">Price</th></tr></thead><tbody>
                    ${saleCart.map(i => `<tr><td>${i.name}</td><td align="center">${i.qty}</td><td align="right">$${(i.price*i.qty).toFixed(2)}</td></tr>`).join('')}
                    </tbody><tfoot><tr><td colspan="2">Total</td><td align="right">$${saleTotal.toFixed(2)}</td></tr></tfoot></table>
                    <br><button onclick="window.print()">Print</button>
                    </body></html>`);
                w.document.close();
                w.focus();
            };

            document.getElementById('postSaleNewBtn').onclick = function() {
                cart = [];
                renderCart();
                renderMenu();
            };
        }

        // Add ability to X out of the Lightning QR modal
        function showLightningQrModal(invoice) {
            // ...existing code to build modal...
            // Add close (X) button
            const closeBtn = document.createElement('button');
            closeBtn.textContent = '×';
            closeBtn.setAttribute('aria-label', 'Close');
            closeBtn.style.position = 'absolute';
            closeBtn.style.right = '16px';
            closeBtn.style.top = '16px';
            closeBtn.style.background = '#fff';
            closeBtn.style.color = '#f7931a';
            closeBtn.style.border = 'none';
            closeBtn.style.fontSize = '2em';
            closeBtn.style.cursor = 'pointer';
            closeBtn.style.zIndex = '10';
            closeBtn.onclick = function() {
                lightningQrModal.style.display = 'none';
            };
            lightningQrModal.style.position = 'relative';
            lightningQrModal.appendChild(closeBtn);
            // ...existing code to show QR and invoice string...
        }

    </script>
    <!-- Bitcoin Lightning QR Modal (required for Lightning payments) -->
    <div id="btcLightningQrModal" style="display:none;position:fixed;z-index:1000;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.35);align-items:center;justify-content:center;">
      <div style="background:#fff;padding:2.2em 1.5em 1.5em 1.5em;border-radius:16px;box-shadow:0 8px 32px #0003;max-width:410px;width:95vw;position:relative;display:flex;flex-direction:column;align-items:center;">
        <button id="btcLightningQrClose" style="position:absolute;top:0.7em;right:0.7em;background:none;border:none;font-size:1.6em;line-height:1;cursor:pointer;color:#e67e22;">×</button>
        <div id="btcLightningQrAccount" style="font-size:1.15em;margin-bottom:0.7em;text-align:center;"></div>
        <div id="btcLightningQrCode" style="margin:0 auto 1.2em auto;display:flex;justify-content:center;"></div>
        <div id="btcLightningInvoice" style="word-break:break-all;font-size:1.02em;background:#f4f4f4;padding:0.7em 0.8em;border-radius:7px;margin-bottom:0.7em;text-align:center;max-width:350px;overflow-wrap:break-word;"></div>
      </div>
    </div>
    
    <script>
    // Lightning QR modal close logic
    const _lqModal = document.getElementById('btcLightningQrModal');
    document.getElementById('btcLightningQrClose').onclick = () => _lqModal.style.display = 'none';
    document.addEventListener('keydown', e => {
        if (_lqModal.style.display === 'flex' && (e.key === 'Escape' || e.key === 'Esc'))
            _lqModal.style.display = 'none';
    });
    _lqModal.addEventListener('click', e => { if (e.target === _lqModal) _lqModal.style.display = 'none'; });
    </script>
    <!-- Bitcoin Lightning Payment Listener -->
    <script>
    let lightningPaymentListenerInterval = null;
    function startLightningPaymentListener(shortMemo) {
        if (lightningPaymentListenerInterval) clearInterval(lightningPaymentListenerInterval);
        const settings = getStoreSettings();
        const bl = settings.bitcoinLightningConfig || {};
        const hiveAccount = (bl.hive_accname || '').toLowerCase();
        const statusDiv = document.getElementById('btcLightningInvoice');
        let attempts = 0;
        lightningPaymentListenerInterval = setInterval(async function() {
            attempts++;
            if (!hiveAccount || !shortMemo) return;
            try {
                const response = await fetch('https://api.hive.blog', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'condenser_api.get_account_history',
                        params: [hiveAccount, -1, 50], // fetch more ops for reliability
                        id: 1
                    })
                });
                const data = await response.json();
                const history = data.result;
                for (let i = history.length - 1; i >= 0; i--) {
                    const op = history[i][1].op;
                    if (
                        op[0] === 'transfer' &&
                        (op[1].to || '').toLowerCase() === hiveAccount &&
                        (op[1].from || '').toLowerCase() === 'v4vapp' &&
                        op[1].memo && op[1].memo.toLowerCase().includes(shortMemo.toLowerCase())
                    ) {
                        statusDiv.innerHTML = `<span style="color:#27ae60;font-weight:bold;">${t('pos.lightningReceived')}</span>`;
                        clearInterval(lightningPaymentListenerInterval);
                        lightningPaymentListenerInterval = null;
                        showLightningPaidNotification();
                        return;
                    }
                }
                statusDiv.innerHTML = `<span style="color:#f7931a;">${t('pos.lightningWaiting')}</span>`;
            } catch (e) {
                statusDiv.innerHTML = `<span style="color:#e74c3c;">${t('pos.paymentError')}</span>`;
            }
            if (attempts > 100) {
                statusDiv.innerHTML = `<span style="color:#e74c3c;">${t('pos.paymentTimeout')}</span>`;
                clearInterval(lightningPaymentListenerInterval);
                lightningPaymentListenerInterval = null;
            }
        }, 3000);
    }

    function showLightningPaidNotification() {
        // Create notification overlay
        let notif = document.createElement('div');
        notif.id = 'lightningPaidNotif';
        notif.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.45);z-index:2000;display:flex;align-items:center;justify-content:center;';
        notif.innerHTML = `<div style="background:#fff;padding:2.5em 2em 2em 2em;border-radius:18px;box-shadow:0 8px 32px #0003;max-width:350px;width:90vw;display:flex;flex-direction:column;align-items:center;">
            <div style='font-size:2.5em;margin-bottom:0.5em;color:#27ae60;'>✅</div>
            <div style='font-size:1.25em;font-weight:bold;text-align:center;margin-bottom:1em;'>Bitcoin Lightning Payment Confirmed!</div>
            <button id='closeLightningPaidNotif' style='background:#27ae60;color:#fff;font-size:1.1em;padding:0.7em 2em;border:none;border-radius:8px;cursor:pointer;'>OK</button>
        </div>`;
        document.body.appendChild(notif);
        document.getElementById('closeLightningPaidNotif').onclick = function() {
            notif.remove();
            // Refresh app for new sale
            window.location.reload();
        };
    }
    </script>
