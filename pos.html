<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point of Sale</title>
    <script src="i18n.js"></script>
    <script src="payment-plugins.js"></script>
    <meta name="theme-color" content="#b5651d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hive POS">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/sweetplace logo.png">
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ── POS page layout ── */
        body { margin: 0; }

        .pos-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg);
        }

        /* Top bar */
        .pos-topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 40;
        }
        /* On mobile: secondary items drop to a second row */
        .pos-topbar-secondary {
            display: contents; /* transparent on desktop — items stay in the main row */
        }
        @media (max-width: 640px) {
            .pos-topbar { padding: 0.6rem 1rem; gap: 0.5rem; }
            .pos-topbar-secondary {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex-wrap: wrap;
                width: 100%;
                order: 10;
            }
            #bannerContainer { display: none !important; }
            #logoutBtn { margin-left: auto !important; }
        }
        .pos-biz-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pos-hive-badge {
            font-size: 0.8rem;
            color: var(--text-2);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r-full);
            padding: 0.3em 0.8em;
            white-space: nowrap;
        }
        /* Banner */
        #bannerContainer img {
            max-height: 90px;
            border-radius: var(--r);
        }

        /* Body: catalog + cart */
        .pos-body {
            display: flex;
            flex: 1;
            gap: 0;
            overflow: hidden;
        }

        /* Catalog (left) */
        .pos-catalog {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.875rem;
        }

        /* Cart (right panel) */
        .pos-cart-panel {
            width: 300px;
            flex-shrink: 0;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .cart-head {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .cart-head h2 { font-size: 1rem; font-weight: 600; }

        .cart-body {
            flex: 1;
            overflow-y: auto;
        }
        .cart-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .cart-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 0.5rem;
            font-size: 0.875rem;
        }
        .cart-item-name { font-weight: 500; color: var(--text); flex: 1; min-width: 0; }
        .cart-item-qty  { display: flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
        .cart-item-price { font-weight: 600; color: var(--text); flex-shrink: 0; min-width: 52px; text-align: right; }

        .qty-btn {
            width: 24px; height: 24px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            background: var(--bg);
            color: var(--text);
            font-size: 0.875rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--ease);
            flex-shrink: 0;
        }
        .qty-btn:hover { background: var(--border); }
        .qty-num { font-size: 0.85rem; font-weight: 600; min-width: 18px; text-align: center; }

        .remove-btn {
            width: 24px; height: 24px;
            border: none;
            border-radius: var(--r-sm);
            background: var(--red-light);
            color: var(--red);
            font-size: 0.8rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--ease);
            flex-shrink: 0;
        }
        .remove-btn:hover { background: var(--red); color: #fff; }

        .cart-empty {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-3);
            font-size: 0.875rem;
        }

        .cart-foot {
            border-top: 1px solid var(--border);
            padding: 1rem 1.25rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .cart-total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        /* QR / payment overlay */
        #qrInlineContainer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(28,25,23,0.45);
            backdrop-filter: blur(3px);
            z-index: 800;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        #qrInlineContainer.open { display: flex; }

        /* Post-sale row */
        #postSaleRow {
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 1.25rem;
            box-shadow: var(--sh-lg);
            max-width: 380px;
            width: 100%;
        }

        /* Mobile: stack catalog above cart */
        @media (max-width: 768px) {
            .pos-body { flex-direction: column; overflow: visible; }
            .pos-cart-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
            .pos-catalog { padding: 1rem; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.625rem; }
        }
        /* ── Tables / Tabs feature ── */
        #tablesOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:500; align-items:center; justify-content:center; padding:1rem; }
        #tablesOverlay.open { display:flex; }
        .tables-panel { background:var(--surface); border-radius:var(--r-lg); padding:1.5rem; max-width:520px; width:100%; box-shadow:var(--sh-lg); max-height:80vh; overflow-y:auto; }
        .tables-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:.75rem; margin-top:1rem; }
        .table-tile { padding:.9rem .5rem; border-radius:var(--r); border:2px solid var(--border); background:var(--bg); cursor:pointer; text-align:center; transition:var(--ease); user-select:none; position:relative; }
        .table-tile:hover { border-color:var(--primary); }
        .table-tile.has-tab { border-color:var(--amber); background:var(--amber-light,#fff8ed); }
        .tile-void-x { position:absolute; top:.3rem; right:.3rem; background:transparent; border:none; color:var(--red,#e74c3c); font-size:1rem; line-height:1; cursor:pointer; width:1.4rem; height:1.4rem; display:flex; align-items:center; justify-content:center; border-radius:50%; }
        .tile-void-x:hover { background:var(--red,#e74c3c); color:#fff; }
        .tile-label { font-weight:700; font-size:1rem; }
        .tile-sub { font-size:.72rem; color:var(--text-2); margin-top:.15rem; }
        .tile-sub.open { color:var(--amber); font-weight:600; }
        #tabBadge { display:none; font-size:.78rem; font-weight:600; color:var(--amber); background:var(--amber-light,#fff8ed); border:1px solid var(--amber); border-radius:30px; padding:.15em .65em; flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    </style>
  <script src="pwa.js"></script>
</head>
<body>
<div class="pos-page">
    <!-- Top bar -->
    <header class="pos-topbar">
        <span id="businessNameHeader" class="pos-biz-name">Point of Sale</span>
        <span id="langToggleContainer"></span>
        <button id="logoutBtn" class="btn btn-secondary btn-sm" data-i18n="common.logout" style="margin-left:auto;min-width:72px;">Logout</button>
        <div class="pos-topbar-secondary">
            <div id="bannerContainer"></div>
            <div id="hiveAccountDisplay" class="pos-hive-badge" style="display:none;"></div>
            <div id="cashierBadge" style="display:none;font-size:0.8rem;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-full);padding:0.2rem 0.7rem;"></div>
            <a href="members.html" id="membersLinkBtn" class="btn btn-secondary btn-sm" style="display:none;text-decoration:none">👥 Members</a>
            <button id="tablesBtn" class="btn btn-secondary btn-sm" style="display:none" onclick="showTablesPanel()" data-i18n="pos.tablesBtn">🪑 Tables</button>
        </div>
    </header>

    <!-- Main body -->
    <div class="pos-body">
        <!-- Product catalog -->
        <main class="pos-catalog">
            <div class="filter-pills" id="categoryTabs"></div>
            <div class="product-grid" id="menuList"></div>
        </main>

        <!-- Cart panel -->
        <aside class="pos-cart-panel">
            <div class="cart-head">
                <h2>Cart</h2>
                <span id="tabBadge"></span>
                <button id="clearCartBtn" class="btn btn-ghost btn-sm" title="Clear Cart">🗑</button>
            </div>
            <div class="cart-body" id="cart">
                <ul class="cart-list" id="cartList"></ul>
            </div>
            <div class="cart-foot" id="cartFoot">
                <div class="cart-total" id="cartTotal">Total: $0.00</div>
            </div>
        </aside>
    </div>

    <!-- QR / payment overlay -->
    <div id="qrInlineContainer"></div>
</div>

<!-- Tables Overlay -->
<div id="tablesOverlay">
  <div class="tables-panel">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem">
      <h3 style="margin:0;font-size:1.05rem">Select Table</h3>
      <button onclick="hideTablesPanel()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-2);line-height:1;">×</button>
    </div>
    <p style="margin:0 0 .5rem;font-size:.82rem;color:var(--text-2)">Tap a table to open or resume its tab.</p>
    <div class="tables-grid" id="tilesGrid"></div>
    <button onclick="selectTable(null)" class="btn btn-secondary btn-block" style="margin-top:1rem;width:100%;">⚡ Quick Sale (No Table)</button>
  </div>
</div>

<!-- Pass Contact Modal -->
<div id="passContactModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--surface);border-radius:var(--r-lg);padding:1.5rem;width:min(360px,92vw);box-shadow:var(--sh-lg)">
    <h3 style="margin:0 0 1rem;font-size:1rem" id="passModalTitle">Pass Holder Info</h3>
    <div style="display:flex;flex-direction:column;gap:.65rem">
      <div>
        <label style="font-size:.8rem;font-weight:600;display:block;margin-bottom:.25rem" id="passNameLabel">Name *</label>
        <input id="passName" type="text" class="form-control" style="width:100%">
      </div>
      <div>
        <input id="passEmail" type="email" class="form-control" style="width:100%" placeholder="Email (optional)">
      </div>
      <div>
        <input id="passPhone" type="tel" class="form-control" style="width:100%" placeholder="Phone (optional)">
      </div>
      <div id="passError" style="color:var(--red);font-size:.82rem"></div>
      <div style="display:flex;gap:.5rem;margin-top:.25rem">
        <button class="btn btn-primary" style="flex:1" id="passAddBtn">Add to Cart</button>
        <button class="btn btn-secondary" onclick="document.getElementById('passContactModal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>
</div>

    <!-- Add QR code library if not already present -->
    <script>
    if (!window.QRCode) {
        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        document.head.appendChild(script);
    }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            i18n.init();
            i18n.renderLangToggle(document.getElementById('langToggleContainer'));
        });
        // --- Bitcoin Lightning minimum amount check ---
        function isLightningAmountValid(amount, currency) {
            // Accept both 'USD' and 'usd' for safety
            return !(currency === 'USD' || currency === 'usd') || parseFloat(amount) >= 0.25;
        }
        // Load items from localStorage
        function getItems() {
            return JSON.parse(localStorage.getItem('pos_items') || '[]');
        }
        // --- Banner and Business Name Logic ---
        function getStoreSettings() {
            return JSON.parse(localStorage.getItem('pos_settings') || '{"businessName":"","bannerUrl":"","categories":["drink","pastry","bread","other"],"hiveAccount":""}');
        }
        function calculateCartTotals() {
            const itemsTotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
            const tax = getStoreSettings().tax || {};
            if (!tax.enabled || !tax.rate) {
                return { subtotal: itemsTotal, taxAmount: 0, total: itemsTotal };
            }
            if (tax.inclusive) {
                const subtotal = itemsTotal / (1 + tax.rate / 100);
                const taxAmount = itemsTotal - subtotal;
                return { subtotal, taxAmount, total: itemsTotal };
            } else {
                const taxAmount = itemsTotal * (tax.rate / 100);
                return { subtotal: itemsTotal, taxAmount, total: itemsTotal + taxAmount };
            }
        }
        function renderBannerAndName() {
            const settings = getStoreSettings();
            // Banner
            const bannerDiv = document.getElementById('bannerContainer');
            bannerDiv.innerHTML = settings.bannerUrl ? `<img src="${settings.bannerUrl}" alt="Banner" style="max-width:100%;max-height:120px;border-radius:8px;">` : '';
            // Business Name
            document.getElementById('businessNameHeader').textContent = settings.businessName || t('pos.title');
            // Cashier badge
            const cashierUser = JSON.parse(localStorage.getItem('pos_cashier_user') || 'null');
            const cashierBadge = document.getElementById('cashierBadge');
            if (cashierUser?.username) {
                cashierBadge.textContent = '👤 ' + cashierUser.username;
                cashierBadge.style.display = '';
            }
            // Members link (visible when the store has memberships enabled)
            const features = JSON.parse(localStorage.getItem('pos_features') || '{}');
            if (features.memberships) {
                document.getElementById('membersLinkBtn').style.display = '';
            }
            const tablesBtn = document.getElementById('tablesBtn');
            if (tablesBtn) tablesBtn.style.display = features.tabs ? '' : 'none';
        }
        // --- Category Tabs Logic (updated to use store settings) ---
        function getCategories(items) {
            const settings = getStoreSettings();
            // Only show categories that exist in store settings
            return (settings.categories || []).filter(cat => items.some(item => item.category === cat));
        }
        let currentCategory = 'all';
        function renderCategoryTabs(items) {
            const cats = getCategories(items);
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = '';
            // All pill
            const allBtn = document.createElement('button');
            allBtn.className = 'pill' + (currentCategory === 'all' ? ' active' : '');
            allBtn.innerHTML = `${t('pos.all')} <span class="pill-count">${items.length}</span>`;
            allBtn.onclick = () => { currentCategory = 'all'; renderMenu(); };
            tabs.appendChild(allBtn);
            // Category pills
            cats.forEach(cat => {
                const count = items.filter(i => i.category === cat).length;
                const btn = document.createElement('button');
                btn.className = 'pill' + (currentCategory === cat ? ' active' : '');
                btn.innerHTML = `${cat.charAt(0).toUpperCase() + cat.slice(1)} <span class="pill-count">${count}</span>`;
                btn.onclick = () => { currentCategory = cat; renderMenu(); };
                tabs.appendChild(btn);
            });
        }
        // Render menu
        function renderMenu() {
            renderBannerAndName();
            renderHiveAccount();
            const items = getItems();
            renderCategoryTabs(items);
            const menu = document.getElementById('menuList');
            menu.innerHTML = '';
            const filtered = currentCategory === 'all' ? items : items.filter(i => i.category === currentCategory);
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'product-card';
                const initial = item.name.charAt(0).toUpperCase();
                div.innerHTML = `
                    <div class="product-thumb">
                        ${item.image ? `<img src="${item.image}" alt="${item.name}">` : `<span class="product-initial">${initial}</span>`}
                    </div>
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">$${item.price.toFixed(2)}</div>
                    </div>
                `;
                div.onclick = () => addToCart(item);
                menu.appendChild(div);
            });

            // Pass types section
            const passes = window.passTypes || [];
            if (passes.length && currentCategory === 'all') {
                const divider = document.createElement('div');
                divider.style.cssText = 'width:100%;grid-column:1/-1;display:flex;align-items:center;gap:.75rem;margin:.5rem 0 .25rem;font-size:.78rem;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em';
                divider.innerHTML = `<span>${t('pass.section')}</span><span style="flex:1;height:1px;background:var(--border)"></span>`;
                menu.appendChild(divider);
                passes.forEach(pt => {
                    const div = document.createElement('div');
                    div.className = 'product-card';
                    div.style.cssText = 'border-color:var(--amber);position:relative';
                    div.innerHTML = `
                        <div style="position:absolute;top:.35rem;right:.35rem;background:var(--amber);color:#fff;font-size:.62rem;font-weight:700;padding:.1em .4em;border-radius:3px">${t('pass.badge')}</div>
                        <div class="product-thumb" style="background:var(--amber-light)">
                            <span class="product-initial" style="color:var(--amber)">🎫</span>
                        </div>
                        <div class="product-info">
                            <div class="product-name">${pt.name}</div>
                            <div class="product-price">$${parseFloat(pt.price).toFixed(2)}</div>
                        </div>
                    `;
                    div.onclick = () => openPassModal(pt);
                    menu.appendChild(div);
                });
            }
        }
        // Pass contact modal
        let _pendingPassType = null;
        function openPassModal(passType) {
            _pendingPassType = passType;
            document.getElementById('passModalTitle').textContent = passType.name + ' — ' + t('pass.contactTitle');
            document.getElementById('passNameLabel').textContent = t('pass.nameLabel');
            document.getElementById('passName').value = '';
            document.getElementById('passEmail').value = '';
            document.getElementById('passPhone').value = '';
            document.getElementById('passError').textContent = '';
            document.getElementById('passName').placeholder = t('pass.namePlaceholder');
            document.getElementById('passEmail').placeholder = t('pass.emailPlaceholder');
            document.getElementById('passPhone').placeholder = t('pass.phonePlaceholder');
            document.getElementById('passAddBtn').textContent = t('pass.addToCart');
            document.getElementById('passContactModal').style.display = 'flex';
            setTimeout(() => document.getElementById('passName').focus(), 50);
        }
        document.getElementById('passAddBtn').onclick = function() {
            const name = document.getElementById('passName').value.trim();
            if (!name) { document.getElementById('passError').textContent = t('pass.nameLabel').replace(' *','') + ' is required'; return; }
            const contact = { name, email: document.getElementById('passEmail').value.trim(), phone: document.getElementById('passPhone').value.trim() };
            document.getElementById('passContactModal').style.display = 'none';
            addPassToCart(_pendingPassType, contact);
        };
        function addPassToCart(passType, contact) {
            cart.push({
                id: 'pass_' + passType._id + '_' + Date.now(),
                name: passType.name,
                price: passType.price,
                qty: 1,
                isPass: true,
                membershipTypeId: passType._id,
                passContact: contact,
            });
            renderCart();
        }

        // Cart logic
        let cart = [];
        let currentTabState = null; // { tabId, tableId, tableLabel } when in table mode, else null
        let openTabsByTable = {};   // tableId → open Sale document
        function addToCart(item) {
            // Check if item already in cart
            const found = cart.find(ci => ci.id === item.id);
            if (found) {
                found.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            renderCart();
        }
        function renderCart() {
            const list = document.getElementById('cartList');
            list.innerHTML = '';
            if (cart.length === 0) {
                list.innerHTML = '<div class="cart-empty">No items yet</div>';
            } else {
                cart.forEach((item, idx) => {
                    const lineTotal = item.price * item.qty;
                    const li = document.createElement('li');
                    const noteDisplay = (!item.isPass && item.notes)
                        ? `<span style="font-size:.7rem;color:var(--amber);display:block;margin-top:.1rem;">${posEscHtml(item.notes)}</span>`
                        : '';
                    const nameHtml = item.isPass
                        ? `<span class="cart-item-name">${item.name}<br><span style="font-size:.75em;color:var(--amber);font-weight:600">👤 ${item.passContact?.name || ''}</span></span>`
                        : `<span class="cart-item-name">${item.name}${noteDisplay}<button onclick="editItemNote(${idx})" title="${t('pos.addNote')}" style="background:none;border:none;cursor:pointer;font-size:.7rem;color:var(--text-3);padding:0 .15rem;vertical-align:middle;">📝</button></span>`;
                    const qtyHtml = item.isPass
                        ? `<span class="cart-item-qty"><button class="remove-btn" onclick="removeFromCart(${idx})">✕</button></span>`
                        : `<span class="cart-item-qty">
                            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                            <button class="remove-btn" onclick="removeFromCart(${idx})">✕</button>
                           </span>`;
                    li.innerHTML = `${nameHtml}${qtyHtml}<span class="cart-item-price">$${lineTotal.toFixed(2)}</span>`;
                    list.appendChild(li);
                });
            }
            const { subtotal, taxAmount, total } = calculateCartTotals();
            const tax = getStoreSettings().tax || {};
            let totalHtml = '';
            if (tax.enabled && tax.rate && taxAmount > 0) {
                if (tax.inclusive) {
                    totalHtml = `${t('pos.total', { amount: total.toFixed(2) })}<br><span style="font-size:.75em;color:var(--text-2)">${t('tax.includesLine', { name: tax.name || 'Tax', rate: tax.rate })} $${taxAmount.toFixed(2)}</span>`;
                } else {
                    totalHtml = `<span style="font-size:.85em;color:var(--text-2)">${t('tax.subtotal')}: $${subtotal.toFixed(2)}<br>${t('tax.taxLine', { name: tax.name || 'Tax', rate: tax.rate })}: $${taxAmount.toFixed(2)}</span><br>${t('pos.total', { amount: total.toFixed(2) })}`;
                }
                document.getElementById('cartTotal').innerHTML = totalHtml;
            } else {
                document.getElementById('cartTotal').textContent = t('pos.total', { amount: total.toFixed(2) });
            }
        }
        function renderHiveAccount() {
            const settings = getStoreSettings();
            const features = JSON.parse(localStorage.getItem('pos_features') || '{}');
            const hiveDiv = document.getElementById('hiveAccountDisplay');
            if (features.hive && settings.hiveAccount) {
                hiveDiv.textContent = `@${settings.hiveAccount}`;
                hiveDiv.style.display = '';
            } else {
                hiveDiv.textContent = '';
                hiveDiv.style.display = 'none';
            }

        // QR Inline logic
        function showQrInline() {
            const settings = getStoreSettings();
            const hiveAccount = settings.hiveAccount;
            if (!hiveAccount) {
                alert(t('pos.noHiveAccount'));
                return;
            }
            const { total } = calculateCartTotals();
            if (total <= 0) {
                alert('Cart is empty.');
                return;
            }
            // Prepare memo: use current system time (ISO string)
            const memoDecoded = new Date().toISOString();
            window.lastPaymentMemo = memoDecoded; // Save for listener
            window.lastPaymentAmount = `${total.toFixed(3)} HBD`;
            const op = [
              "transfer",
              {
                to: hiveAccount,
                amount: `${total.toFixed(3)} HBD`,
                memo: memoDecoded
              }
            ];
            const json = JSON.stringify(op);
            const base64 = btoa(json)
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=+$/, "");
            const uri = `hive://sign/op/${base64}`;

            // Generate QR code
            const qrDiv = document.getElementById('qrInlineContainer');
            qrDiv.innerHTML = `<div style='background:var(--surface);padding:2rem 1.5rem;border-radius:var(--r-xl);box-shadow:var(--sh-lg);display:flex;flex-direction:column;align-items:center;max-width:360px;width:100%;'>
                <h2 style='margin:0 0 1.25rem;text-align:center;font-size:1.1rem;'>${t('pos.scanToPay')}</h2>
                <div id='qrCodeInline' style='margin-bottom:1.25rem;min-height:240px;display:flex;align-items:center;justify-content:center;'></div>
                <div style='font-size:0.95rem;margin-bottom:1rem;text-align:center;color:var(--text-2);line-height:1.6;'><b style="color:var(--text);">To:</b> @${hiveAccount}<br><b style="color:var(--text);">Amount:</b> ${total.toFixed(3)} HBD</div>
                <div style='word-break:break-all;font-size:0.78rem;background:var(--bg);padding:0.6em 0.8em;border-radius:var(--r);text-align:center;color:var(--text-3);border:1px solid var(--border);width:100%;'>${uri}</div>
                <div id='paymentStatus' style='margin-top:1rem;font-size:0.95rem;font-weight:500;color:var(--green);text-align:center;'></div>
            </div>`;
            qrDiv.classList.add('open');
            setTimeout(() => {
                const qrCodeDiv = document.getElementById('qrCodeInline');
                qrCodeDiv.innerHTML = '';
                if (window.QRCode) {
                    new QRCode(qrCodeDiv, {
                        text: uri,
                        width: 240,
                        height: 240,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } else {
                    qrCodeDiv.textContent = t('pos.qrLibMissing');
                }
            }, 0);
            // Start payment listener
            startPaymentListener();
        }

        // --- Payment Listener ---
        let paymentListenerInterval = null;
        function startPaymentListener() {
            if (paymentListenerInterval) clearInterval(paymentListenerInterval);
            const settings = getStoreSettings();
            const hiveAccount = settings.hiveAccount;
            const expectedAmount = window.lastPaymentAmount;
            const expectedMemo = window.lastPaymentMemo;
            const statusDiv = document.getElementById('paymentStatus');
            let attempts = 0;
            paymentListenerInterval = setInterval(async function() {
                attempts++;
                if (!hiveAccount || !expectedAmount || !expectedMemo) return;
                try {
                    const response = await fetch('https://api.hive.blog', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            jsonrpc: '2.0',
                            method: 'condenser_api.get_account_history',
                            params: [hiveAccount, -1, 20],
                            id: 1
                        })
                    });
                    const data = await response.json();
                    const history = data.result;
                    for (let i = history.length - 1; i >= 0; i--) {
                        const op = history[i][1].op;
                        if (op[0] === 'transfer' &&
                            op[1].to === hiveAccount &&
                            op[1].amount === expectedAmount &&
                            op[1].memo === expectedMemo) {
                            statusDiv.textContent = t('pos.paymentReceived');
                            clearInterval(paymentListenerInterval);
                            paymentListenerInterval = null;
                            // Show post-sale actions for HBD
                            const saleCart = cart.map(i => ({...i}));
                            const { subtotal: saleSub, taxAmount: saleTax, total: saleTotal } = calculateCartTotals();
                            cart = [];
                            renderCart();
                            renderMenu();
                            showPostSaleActions('hbd', saleCart, saleTotal, op[1].from, op[1].memo, '', saleSub, saleTax);
                            return;
                        }
                    }
                    statusDiv.textContent = t('pos.waitingPayment');
                } catch (e) {
                    statusDiv.textContent = t('pos.paymentError');
                }
                if (attempts > 100) {
                    statusDiv.textContent = t('pos.paymentTimeout');
                    clearInterval(paymentListenerInterval);
                    paymentListenerInterval = null;
                }
            }, 3000);
        }

        // Dispatcher — routes plugin button taps to the right handler
        async function handlePluginPayment(pluginId) {
            const pluginCfgs = getPluginConfigs();
            const cfg = pluginCfgs[pluginId] || {};
            switch (pluginId) {
                case 'hive':
                    if (window._posShowKeychain) window._posShowKeychain();
                    showQrInline();
                    break;
                case 'stripe':
                    openStripeModal();
                    break;
                case 'lightning':
                    handleLightningPayment(cfg);
                    break;
                default:
                    if (window._posShowExternal) window._posShowExternal(pluginId);
            }
        }

        function setupPaymentButtons() {
            renderPaymentButtons();

            const qrInline        = document.getElementById('qrInlineContainer');
            const cashSection     = document.getElementById('cashPaymentSection');
            const externalSection = document.getElementById('externalPaymentSection');
            const cashInput       = document.getElementById('cashGivenInput');
            const changeDue       = document.getElementById('changeDueDisplay');
            const finishBtn       = document.getElementById('finishCashSaleBtn');
            const finishExtBtn    = document.getElementById('finishExternalSaleBtn');
            const extNotesInput   = document.getElementById('externalNotesInput');
            const extNotesLabel   = document.getElementById('externalNotesLabel');
            let currentExternalMethod = '';

            function hideAllSections() {
                qrInline.classList.remove('open');
                cashSection.style.display = 'none';
                externalSection.style.display = 'none';
            }
            function showKeychain() {
                hideAllSections();
                qrInline.classList.add('open');
            }
            function showCash() {
                hideAllSections();
                cashSection.style.display = 'block';
                if (cashInput) { cashInput.value = ''; }
                if (changeDue) { changeDue.textContent = ''; }
            }
            function showExternal(method) {
                hideAllSections();
                currentExternalMethod = method;
                const isOther = method === 'other';
                if (extNotesLabel) extNotesLabel.textContent = t('pos.paymentNotesLabel') + (isOther ? ' *' : '');
                if (extNotesInput) { extNotesInput.value = ''; extNotesInput.placeholder = isOther ? t('pos.paymentNotesRequired') : t('pay.notesPlaceholder'); }
                externalSection.style.display = 'block';
                if (extNotesInput) extNotesInput.focus();
            }

            // Make these available to handlePluginPayment
            window._posShowKeychain = showKeychain;
            window._posShowExternal = showExternal;

            const saveTabBtn       = document.getElementById('saveTabBtn');
            const backToTablesBtn  = document.getElementById('backToTablesBtn');
            const voidTabBtn_      = document.getElementById('voidTabBtn');
            const sendToKitchenBtn = document.getElementById('sendToKitchenBtn');
            if (saveTabBtn)       saveTabBtn.onclick      = saveTab;
            if (voidTabBtn_)      voidTabBtn_.onclick     = voidTab;
            if (sendToKitchenBtn) sendToKitchenBtn.onclick = sendToKitchen;
            if (backToTablesBtn)  backToTablesBtn.onclick  = function() {
                cart = []; currentTabState = null;
                renderTabBadge(); renderCart(); renderMenu(); showTablesPanel();
            };

            document.getElementById('payWithCashBtn')?.addEventListener('click', showCash);
            document.getElementById('payWithBankBtn')?.addEventListener('click', () => showExternal('bank_transfer'));
            document.getElementById('payWithCheckBtn')?.addEventListener('click', () => showExternal('check'));
            document.getElementById('payWithOtherBtn')?.addEventListener('click', () => showExternal('other'));

            // Attach plugin buttons
            document.querySelectorAll('.plugin-pay-btn').forEach(btn => {
                btn.addEventListener('click', () => handlePluginPayment(btn.dataset.plugin));
            });

            if (cashInput) {
                cashInput.oninput = function() {
                    const given = parseFloat(cashInput.value);
                    const total = calculateCartTotals().total;
                    if (isNaN(given)) { changeDue.textContent = ''; return; }
                    const change = given - total;
                    changeDue.textContent = change >= 0 ? t('pos.changeDue', { amount: change.toFixed(2) }) : t('pos.notEnoughCash');
                };
            }
            if (finishBtn) {
                finishBtn.onclick = function() {
                    const saleCart = cart.map(i => ({...i}));
                    const { subtotal: saleSub, taxAmount: saleTax, total: saleTotal } = calculateCartTotals();
                    cart = []; renderCart(); renderMenu();
                    showPostSaleActions('cash', saleCart, saleTotal, null, null, '', saleSub, saleTax);
                };
            }
            if (finishExtBtn) {
                finishExtBtn.onclick = function() {
                    if (currentExternalMethod === 'other' && !extNotesInput.value.trim()) {
                        alert(t('pos.paymentNotesRequired'));
                        extNotesInput.focus();
                        return;
                    }
                    const saleCart = cart.map(i => ({...i}));
                    const { subtotal: saleSub, taxAmount: saleTax, total: saleTotal } = calculateCartTotals();
                    const notes = extNotesInput.value.trim();
                    cart = []; renderCart(); renderMenu();
                    showPostSaleActions(currentExternalMethod, saleCart, saleTotal, null, null, notes, saleSub, saleTax);
                };
            }
        }

        // Lightning handler
        async function handleLightningPayment(cfg) {
            if (!cfg) cfg = getPluginConfigs().lightning || {};
            if (!cfg.hive_accname) {
                alert(t('pos.lightningMissing'));
                return;
            }
            const total = calculateCartTotals().total;
            if (!total || total <= 0) {
                alert(t('pos.cartEmpty'));
                return;
            }
            if (!isLightningAmountValid(total, 'USD')) {
                alert(t('pos.lightningMin'));
                return;
            }
            const shortMemo = `HivePOS-${Math.floor(Math.random()*9000+1000)}`;
            window.lastLightningMemo = shortMemo;
            const modal = document.getElementById('btcLightningQrModal');
            modal.style.display = 'flex';
            document.getElementById('btcLightningQrAccount').textContent = t('pos.lightningReceiving', { account: cfg.hive_accname });
            document.getElementById('btcLightningInvoice').textContent = t('pos.requestingInvoice');
            const qrDiv = document.getElementById('btcLightningQrCode');
            qrDiv.innerHTML = '';
            const params = new URLSearchParams({
                hive_accname: cfg.hive_accname,
                amount: total.toFixed(2),
                currency: 'USD',
                receive_currency: cfg.receive_currency || 'hbd',
                usd_hbd: 'false',
                app_name: cfg.app_name || 'HivePOS',
                expiry: cfg.expiry || '600',
                message: shortMemo,
                qr_code: cfg.qr_code !== undefined ? cfg.qr_code : 'true'
            });
            const url = `https://api.v4v.app/v1/new_invoice_hive?${params.toString()}`;
            try {
                const res = await fetch(url, { headers: { 'accept': 'application/json' } });
                if (!res.ok) throw new Error('API error: ' + res.status);
                const data = await res.json();
                if (data.payment_request) {
                    document.getElementById('btcLightningInvoice').textContent = data.payment_request;
                    qrDiv.innerHTML = '';
                    if (window.QRCode) {
                        new QRCode(qrDiv, {
                            text: data.payment_request,
                            width: 220,
                            height: 220,
                            colorDark: '#000',
                            colorLight: '#fff',
                            correctLevel: window.QRCode.CorrectLevel.H
                        });
                    } else {
                        qrDiv.textContent = 'QR code library not loaded.';
                    }
                    startLightningPaymentListener(shortMemo);
                } else {
                    document.getElementById('btcLightningInvoice').textContent = t('pos.noInvoice');
                    qrDiv.innerHTML = '';
                }
            } catch (err) {
                document.getElementById('btcLightningInvoice').textContent = 'Error: ' + err.message;
                qrDiv.innerHTML = '';
            }
        }
        // --- Initial Render ---
        // Always fetch fresh store data from the backend on load — backend is the single source of truth.
        // Both owner and cashier tokens work; localStorage is just a fallback when offline.
        async function initStoreData() {
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            if (token) {
                try {
                    const API_BASE = localStorage.getItem('pos_api_base') || window.location.origin;
                    const res = await fetch(`${API_BASE}/api/store`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const store = await res.json();
                        localStorage.setItem('pos_items', JSON.stringify(store.items || []));
                        localStorage.setItem('pos_settings', JSON.stringify({
                            businessName: store.businessName || '',
                            bannerUrl: store.bannerUrl || '',
                            categories: store.categories || [],
                            hiveAccount: store.hiveAccount || '',
                            currency: store.currency || 'HBD',
                            tax: store.tax || { enabled: false, rate: 0, name: 'Tax', inclusive: false },
                        }));
                        localStorage.setItem('pos_features', JSON.stringify(store.features || {}));
                        localStorage.setItem('pos_tables', JSON.stringify(store.tables || []));
                        localStorage.setItem('pos_plugin_configs', JSON.stringify(store.pluginConfigs || {}));
                    }
                } catch (e) {
                    // Network error — fall back to whatever is in localStorage
                }
            }
            // Load pass types if memberships enabled
            const feats = JSON.parse(localStorage.getItem('pos_features') || '{}');
            if (feats.memberships) {
                const tok = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
                const apiB = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
                try {
                    const ptRes = await fetch(`${apiB}/membership-types`, { headers: { Authorization: 'Bearer ' + tok } });
                    if (ptRes.ok) {
                        const all = await ptRes.json();
                        window.passTypes = all.filter(mt => mt.isPass && mt.active !== false);
                    }
                } catch (e) { window.passTypes = []; }
            }
            renderMenu();
            renderCart();
            renderHiveAccount();
            setupPaymentButtons();
        }
        initStoreData();

        // Logout — clears only the relevant token, keeps the other role's session intact
        document.getElementById('logoutBtn').onclick = function() {

        // --- Stripe Card Payment Modal ---
        async function openStripeModal() {
            const totals   = calculateCartTotals();
            const total    = totals.total;
            const stripePk = localStorage.getItem('pos_stripe_pk');
            if (!stripePk) { showExternal('card'); return; }

            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;display:flex;align-items:center;justify-content:center';
            modal.innerHTML = `
                <div style="background:var(--surface,#fff);border-radius:var(--r);padding:1.5rem 1.75rem;max-width:380px;width:90%">
                    <h3 style="margin:0 0 .25rem">${t('pos.stripeModalTitle')}</h3>
                    <p style="margin:0 0 .85rem;font-size:.85em;color:var(--text-2)">${t('pos.stripeModalTotal')}: <strong>${total.toFixed(2)}</strong></p>
                    <div id="stripeCardEl" style="border:1px solid var(--border);border-radius:var(--r);padding:.65rem .75rem;min-height:42px;background:#fff"></div>
                    <div id="stripeCardErr" style="color:var(--red,#e74c3c);font-size:.82em;margin-top:.35rem;min-height:1.1em"></div>
                    <div style="display:flex;gap:.5rem;margin-top:.9rem;justify-content:flex-end">
                        <button id="stripeCancelBtn" style="background:transparent;border:1px solid var(--border);border-radius:var(--r);padding:.4rem .9rem;cursor:pointer;font-size:.85em">${t('common.cancel')}</button>
                        <button id="stripeChargeBtn" style="background:#635bff;color:#fff;border:none;border-radius:var(--r);padding:.4rem 1.1rem;cursor:pointer;font-weight:600">${t('pos.stripeCharge')} ${total.toFixed(2)}</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
            document.getElementById('stripeCancelBtn').onclick = () => modal.remove();

            // Load Stripe.js lazily
            if (!window.Stripe) {
                await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = 'https://js.stripe.com/v3/';
                    s.onload = resolve; s.onerror = reject;
                    document.head.appendChild(s);
                });
            }
            const stripe   = Stripe(stripePk);
            const elements = stripe.elements();
            const card     = elements.create('card', { style: { base: { fontSize: '15px', fontFamily: 'inherit' } } });
            card.mount('#stripeCardEl');

            document.getElementById('stripeChargeBtn').onclick = async function() {
                const btn    = this;
                const errEl  = document.getElementById('stripeCardErr');
                btn.disabled = true;
                btn.textContent = t('pos.stripeProcessing');
                errEl.textContent = '';

                const apiBase = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
                const token   = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
                const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

                // 1. Create PaymentIntent
                let clientSecret;
                try {
                    const r = await fetch(`${apiBase}/sales/stripe/intent`, {
                        method: 'POST', headers, body: JSON.stringify({ total }),
                    });
                    const d = await r.json();
                    if (!r.ok) { errEl.textContent = d.error || t('pos.stripeError'); btn.disabled = false; btn.textContent = t('pos.stripeCharge') + ' ' + total.toFixed(2); return; }
                    clientSecret = d.clientSecret;
                } catch { errEl.textContent = t('pos.stripeError'); btn.disabled = false; btn.textContent = t('pos.stripeCharge') + ' ' + total.toFixed(2); return; }

                // 2. Confirm card payment
                const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, { payment_method: { card } });
                if (error) { errEl.textContent = error.message; btn.disabled = false; btn.textContent = t('pos.stripeCharge') + ' ' + total.toFixed(2); return; }

                // 3. Record the sale
                try {
                    const cashierUser = JSON.parse(localStorage.getItem('pos_cashier_user') || 'null');
                    const { subtotal, taxAmount } = calculateCartTotals();
                    const currency = (JSON.parse(localStorage.getItem('pos_settings') || '{}')).currency || 'USD';
                    const r = await fetch(`${apiBase}/sales/stripe/confirm`, {
                        method: 'POST', headers,
                        body: JSON.stringify({
                            paymentIntentId: paymentIntent.id,
                            items: cart.map(i => ({ id: i.id, name: i.name, category: i.category, price: i.price, qty: i.qty, notes: i.notes || '' })),
                            total, subtotal, taxAmount, currency,
                            cashier: cashierUser?.username || '',
                        }),
                    });
                    const sale = await r.json();
                    if (!r.ok) { errEl.textContent = sale.error || t('pos.stripeError'); btn.disabled = false; btn.textContent = t('pos.stripeCharge') + ' ' + total.toFixed(2); return; }
                    modal.remove();
                    const saleCart = [...cart];
                    cart = [];
                    showPostSaleActions('card', saleCart, total, null, null, `Stripe ${paymentIntent.id}`, subtotal, taxAmount);
                } catch { errEl.textContent = t('pos.stripeError'); btn.disabled = false; btn.textContent = t('pos.stripeCharge') + ' ' + total.toFixed(2); }
            };
        }

        // --- Post-Sale Actions ---
        async function showPostSaleActions(paymentType, saleCart, saleTotal, hiveFrom, txId, paymentNotes, subtotal, taxAmount) {
            document.getElementById('qrInlineContainer').classList.remove('open');

            // Auto-save sale to backend (works for both admin and cashier tokens)
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            const apiBase = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
            let savedToBackend = false;
            if (token) {
                try {
                    const isTabClose = !!(currentTabState?.tabId);
                    const fetchUrl = isTabClose
                        ? `${apiBase}/sales/${currentTabState.tabId}/close`
                        : `${apiBase}/sales`;
                    const fetchBody = isTabClose
                        ? {
                            paymentMethod: paymentType.toLowerCase(),
                            paymentNotes: paymentNotes || '',
                            hiveFrom: hiveFrom || null,
                            hiveTransactionId: txId || null,
                            subtotal: subtotal ?? saleTotal,
                            taxAmount: taxAmount ?? 0,
                            total: saleTotal,
                          }
                        : {
                            items: saleCart.map(i => ({ id: i.id, name: i.name, category: i.category, price: i.price, qty: i.qty })),
                            subtotal: subtotal ?? saleTotal,
                            taxAmount: taxAmount ?? 0,
                            total: saleTotal,
                            currency: (getStoreSettings().currency || 'HBD'),
                            paymentMethod: paymentType.toLowerCase(),
                            paymentNotes: paymentNotes || '',
                            hiveFrom: hiveFrom || null,
                            hiveTransactionId: txId || null,
                            cashier: JSON.parse(localStorage.getItem('pos_cashier_user') || 'null')?.username || null,
                          };
                    const saleRes = await fetch(fetchUrl, {
                        method: isTabClose ? 'PATCH' : 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(fetchBody),
                    });
                    if (saleRes.ok) {
                        savedToBackend = true;
                        if (isTabClose) {
                            delete openTabsByTable[currentTabState.tableId];
                            currentTabState = null;
                            renderTabBadge();
                        }
                        // Register pass holders (non-blocking — sale is already saved)
                        const passSales = saleCart.filter(i => i.isPass);
                        for (const pi of passSales) {
                            try {
                                await fetch(`${apiBase}/members/pass-sale`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                    body: JSON.stringify({
                                        membershipTypeId: pi.membershipTypeId,
                                        name:  pi.passContact?.name  || '',
                                        email: pi.passContact?.email || '',
                                        phone: pi.passContact?.phone || '',
                                        paymentMethod: paymentType.toLowerCase(),
                                        paymentNotes: paymentNotes || '',
                                        hiveFrom: hiveFrom || '',
                                        amount: pi.price,
                                    }),
                                });
                            } catch (e) { console.warn('Pass registration failed:', e); }
                        }
                    } else {
                        const errBody = await saleRes.json().catch(() => ({}));
                        console.error('Sale not saved:', saleRes.status, errBody);
                    }
                } catch (err) {
                    console.error('Sale save network error:', err);
                }
            }

            const cartFoot = document.getElementById('cartFoot');
            cartFoot.innerHTML = `
                <div style="text-align:center;padding:0.25rem 0 0.75rem;color:var(--green);font-weight:600;font-size:0.9rem;">✓ ${t('pos.saleComplete')}</div>
                <div id="postSaleActionsRow" style="display:flex;flex-direction:column;gap:0.5rem;">
                    <button id="postSalePrintBtn" class="btn btn-secondary btn-block">${t('pos.printReceipt')}</button>
                    <button id="postSaleNewBtn" class="btn btn-success btn-block">${t('common.newSale')}</button>
                </div>`;

            document.getElementById('postSalePrintBtn').onclick = function() {
                const now = new Date();
                const settings = getStoreSettings();
                const w = window.open('', '_blank', 'width=400,height=600');
                w.document.write(`
                    <html><head><title>Receipt</title>
                    <style>body{font-family:monospace;font-size:12px;padding:1em;width:58mm}
                    h2{font-size:13px;margin:0 0 .5em}table{width:100%;border-collapse:collapse}
                    td,th{font-size:11px;padding:2px 4px}tfoot td{border-top:1px solid #000;font-weight:bold}
                    @media print{button{display:none}}</style></head><body>
                    <h2>${settings.businessName || 'HIVE POS'}</h2>
                    <p style="margin:0;font-size:11px">${now.toLocaleString()}<br>Payment: ${paymentType.toUpperCase()}${hiveFrom ? '<br>From: @' + hiveFrom : ''}</p>
                    <table><thead><tr><th align="left">Item</th><th>Qty</th><th align="right">Price</th></tr></thead><tbody>
                    ${saleCart.map(i => `<tr><td>${i.name}</td><td align="center">${i.qty}</td><td align="right">$${(i.price*i.qty).toFixed(2)}</td></tr>`).join('')}
                    </tbody><tfoot>
                    ${(taxAmount && taxAmount > 0) ? (() => {
                        const tax = getStoreSettings().tax || {};
                        return tax.inclusive
                            ? `<tr><td colspan="2">Total</td><td align="right">$${saleTotal.toFixed(2)}</td></tr>
                               <tr><td colspan="2" style="font-size:10px">${tax.name || 'Tax'} (${tax.rate}%) incl.</td><td align="right" style="font-size:10px">$${taxAmount.toFixed(2)}</td></tr>`
                            : `<tr><td colspan="2">Subtotal</td><td align="right">$${(subtotal||0).toFixed(2)}</td></tr>
                               <tr><td colspan="2">${tax.name || 'Tax'} (${tax.rate}%)</td><td align="right">$${taxAmount.toFixed(2)}</td></tr>
                               <tr><td colspan="2">Total</td><td align="right">$${saleTotal.toFixed(2)}</td></tr>`;
                    })() : `<tr><td colspan="2">Total</td><td align="right">$${saleTotal.toFixed(2)}</td></tr>`}
                    </tfoot></table>
                    <br><button onclick="window.print()">Print</button>
                    </body></html>`);
                w.document.close();
                w.focus();
            };

            document.getElementById('postSaleNewBtn').onclick = function() {
                cart = [];
                renderCart();
                renderMenu();
            };
        }

        // ── Tables / Tabs feature ──────────────────────────────────────────
        function posEscHtml(s) {
            return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderTabBadge() {
            const badge = document.getElementById('tabBadge');
            if (!badge) return;
            if (currentTabState) {
                badge.textContent = '🪑 ' + currentTabState.tableLabel;
                badge.style.display = '';
            } else {
                badge.style.display = 'none';
            }
        }

        async function loadOpenTabs() {
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            if (!token) return {};
            const apiBase = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
            try {
                const res = await fetch(`${apiBase}/sales/open`, { headers: { Authorization: `Bearer ${token}` } });
                if (!res.ok) return {};
                const tabs = await res.json();
                const byTable = {};
                tabs.forEach(tab => { if (tab.tableId) byTable[tab.tableId] = tab; });
                return byTable;
            } catch (e) { return {}; }
        }

        async function showTablesPanel() {
            const tables = JSON.parse(localStorage.getItem('pos_tables') || '[]');
            if (!tables.length) {
                alert('No tables configured. Add tables in the Admin → Tables section.');
                return;
            }
            openTabsByTable = await loadOpenTabs();
            const grid = document.getElementById('tilesGrid');
            grid.innerHTML = '';
            tables.filter(t => t.active !== false).forEach(table => {
                const tab = openTabsByTable[table.id];
                const div = document.createElement('div');
                div.className = 'table-tile' + (tab ? ' has-tab' : '');
                div.innerHTML = `<div class="tile-label">${posEscHtml(table.label)}</div>
                    <div class="tile-sub${tab ? ' open' : ''}">${tab ? `${tab.items.length} item${tab.items.length===1?'':'s'}` : 'Available'}</div>
                    ${tab ? `<button class="tile-void-x" title="${t('pos.voidTab')}">×</button>` : ''}`;
                div.onclick = () => selectTable(table, tab);
                if (tab) {
                    div.querySelector('.tile-void-x').addEventListener('click', e => {
                        e.stopPropagation();
                        voidTabFromTile(tab._id, table.id, table.label);
                    });
                }
                grid.appendChild(div);
            });
            document.getElementById('tablesOverlay').classList.add('open');
        }

        function hideTablesPanel() {
            document.getElementById('tablesOverlay').classList.remove('open');
        }

        function selectTable(table, existingTab) {
            hideTablesPanel();
            if (!table) {
                currentTabState = null;
                renderTabBadge();
                setupPaymentButtons();
                return;
            }
            currentTabState = { tabId: existingTab?._id || null, tableId: table.id, tableLabel: table.label };
            if (existingTab) {
                cart = existingTab.items.map(i => ({ ...i }));
            }
            renderCart();
            renderMenu();
            renderTabBadge();
        }

        async function saveTab() {
            if (!cart.length) { alert('Add items before saving the tab.'); return; }
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            const apiBase = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
            const { subtotal, taxAmount, total } = calculateCartTotals();
            const items = cart.map(i => ({ id: i.id, name: i.name, category: i.category, price: i.price, qty: i.qty, notes: i.notes || '' }));
            try {
                let savedTab;
                if (currentTabState?.tabId) {
                    const res = await fetch(`${apiBase}/sales/${currentTabState.tabId}/items`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ items, subtotal, taxAmount, total }),
                    });
                    if (!res.ok) throw new Error(await res.text());
                    savedTab = await res.json();
                } else {
                    const res = await fetch(`${apiBase}/sales/open`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({
                            items,
                            subtotal,
                            taxAmount,
                            total,
                            currency: getStoreSettings().currency || 'HBD',
                            tableId: currentTabState?.tableId || '',
                            tableLabel: currentTabState?.tableLabel || '',
                        }),
                    });
                    if (!res.ok) throw new Error(await res.text());
                    savedTab = await res.json();
                    if (currentTabState) currentTabState.tabId = savedTab._id;
                }
                if (currentTabState) openTabsByTable[currentTabState.tableId] = savedTab;
            } catch (e) {
                alert('Could not save tab: ' + e.message);
                return;
            }
            cart = [];
            currentTabState = null;
            renderTabBadge();
            renderCart();
            renderMenu();
            showTablesPanel();
        }
        // ── Void tab (from payment row) ───────────────────────────────────
        async function voidTab() {
            if (!currentTabState?.tabId) {
                if (!confirm(t('pos.voidTabUnsaved'))) return;
                cart = [];
                currentTabState = null;
                renderTabBadge();
                renderCart();
                renderMenu();
                return;
            }
            if (!confirm(t('pos.voidTabConfirm'))) return;
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            const apiB = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
            try {
                const res = await fetch(`${apiB}/sales/${currentTabState.tabId}`, {
                    method: 'DELETE',
                    headers: { Authorization: `Bearer ${token}` },
                });
                if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Error');
                if (currentTabState.tableId) delete openTabsByTable[currentTabState.tableId];
                cart = [];
                currentTabState = null;
                renderTabBadge();
                renderCart();
                renderMenu();
                showTablesPanel();
            } catch (e) {
                alert(t('pos.voidTabError', { error: e.message }));
            }
        }
        window.voidTab = voidTab;

        // ── Void tab from tile (tables panel × button) ────────────────────
        async function voidTabFromTile(tabId, tableId, tableLabel) {
            if (!confirm(t('pos.voidTileConfirm', { label: tableLabel }))) return;
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            const apiB = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
            try {
                await fetch(`${apiB}/sales/${tabId}`, {
                    method: 'DELETE',
                    headers: { Authorization: `Bearer ${token}` },
                });
                if (tableId) delete openTabsByTable[tableId];
                if (currentTabState?.tabId === tabId) {
                    cart = [];
                    currentTabState = null;
                    renderTabBadge();
                    renderCart();
                    renderMenu();
                }
                showTablesPanel();
            } catch (e) {
                alert(t('pos.voidTabError', { error: e.message }));
            }
        }
        window.voidTabFromTile = voidTabFromTile;

        // ── Send counter order to kitchen (no table) ──────────────────────
        async function sendToKitchen() {
            if (!cart.length) return;
            const token = localStorage.getItem('pos_admin_token') || localStorage.getItem('pos_cashier_token');
            const apiB = (localStorage.getItem('pos_api_base') || window.location.origin) + '/api';
            const { subtotal, taxAmount, total } = calculateCartTotals();
            const items = cart.map(i => ({ id: i.id, name: i.name, category: i.category, price: i.price, qty: i.qty, notes: i.notes || '' }));
            const counterId = 'counter-' + Date.now();
            try {
                const res = await fetch(`${apiB}/sales/open`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({
                        items, subtotal, taxAmount, total,
                        currency: getStoreSettings().currency || 'HBD',
                        tableId: counterId,
                        tableLabel: t('pos.counterLabel'),
                    }),
                });
                if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Error');
                const savedTab = await res.json();
                currentTabState = { tabId: savedTab._id, tableId: counterId, tableLabel: t('pos.counterLabel') };
                openTabsByTable[counterId] = savedTab;
                renderTabBadge();
                renderCart();
                renderMenu();
            } catch (e) {
                alert(t('pos.voidTabError', { error: e.message }));
            }
        }
        window.sendToKitchen = sendToKitchen;

        // ── Per-item notes ────────────────────────────────────────────────
        function editItemNote(idx) {
            const item = cart[idx];
            if (!item) return;
            const note = window.prompt(t('pos.noteFor', { item: item.name }), item.notes || '');
            if (note === null) return;
            cart[idx].notes = note.trim();
            renderCart();
        }
        window.editItemNote = editItemNote;

    </script>
    <!-- Bitcoin Lightning QR Modal (required for Lightning payments) -->

      <div style="background:#fff;padding:2.2em 1.5em 1.5em 1.5em;border-radius:16px;box-shadow:0 8px 32px #0003;max-width:410px;width:95vw;position:relative;display:flex;flex-direction:column;align-items:center;">

        <div id="btcLightningInvoice" style="word-break:break-all;font-size:1.02em;background:#f4f4f4;padding:0.7em 0.8em;border-radius:7px;margin-bottom:0.7em;text-align:center;max-width:350px;overflow-wrap:break-word;"></div>

    <script>
    // Lightning QR modal close logic
    const _lqModal = document.getElementById('btcLightningQrModal');
    document.getElementById('btcLightningQrClose').onclick = () => _lqModal.style.display = 'none';
    document.addEventListener('keydown', e => {
        if (_lqModal.style.display === 'flex' && (e.key === 'Escape' || e.key === 'Esc'))
            _lqModal.style.display = 'none';
    });
    _lqModal.addEventListener('click', e => { if (e.target === _lqModal) _lqModal.style.display = 'none'; });
    </script>
    <!-- Bitcoin Lightning Payment Listener -->
    <script>
    let lightningPaymentListenerInterval = null;
    function startLightningPaymentListener(shortMemo) {
        if (lightningPaymentListenerInterval) clearInterval(lightningPaymentListenerInterval);
        const settings = getStoreSettings();
        const bl = settings.bitcoinLightningConfig || {};
        const hiveAccount = (bl.hive_accname || '').toLowerCase();
        const statusDiv = document.getElementById('btcLightningInvoice');
        let attempts = 0;
        lightningPaymentListenerInterval = setInterval(async function() {
            attempts++;
            if (!hiveAccount || !shortMemo) return;
            try {
                const response = await fetch('https://api.hive.blog', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'condenser_api.get_account_history',
                        params: [hiveAccount, -1, 50], // fetch more ops for reliability
                        id: 1
                    })
                });
                const data = await response.json();
                const history = data.result;
                for (let i = history.length - 1; i >= 0; i--) {
                    const op = history[i][1].op;
                    if (
                        op[0] === 'transfer' &&
                        (op[1].to || '').toLowerCase() === hiveAccount &&
                        (op[1].from || '').toLowerCase() === 'v4vapp' &&
                        op[1].memo && op[1].memo.toLowerCase().includes(shortMemo.toLowerCase())
                    ) {
                        statusDiv.innerHTML = `<span style="color:#27ae60;font-weight:bold;">${t('pos.lightningReceived')}</span>`;
                        clearInterval(lightningPaymentListenerInterval);
                        lightningPaymentListenerInterval = null;
                        showLightningPaidNotification();
                        return;
                    }
                }
                statusDiv.innerHTML = `<span style="color:#f7931a;">${t('pos.lightningWaiting')}</span>`;
            } catch (e) {
                statusDiv.innerHTML = `<span style="color:#e74c3c;">${t('pos.paymentError')}</span>`;
            }
            if (attempts > 100) {
                statusDiv.innerHTML = `<span style="color:#e74c3c;">${t('pos.paymentTimeout')}</span>`;
                clearInterval(lightningPaymentListenerInterval);
                lightningPaymentListenerInterval = null;
            }
        }, 3000);
    }

    function showLightningPaidNotification() {
        // Create notification overlay
        let notif = document.createElement('div');
        notif.id = 'lightningPaidNotif';
        notif.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.45);z-index:2000;display:flex;align-items:center;justify-content:center;';
        notif.innerHTML = `<div style="background:#fff;padding:2.5em 2em 2em 2em;border-radius:18px;box-shadow:0 8px 32px #0003;max-width:350px;width:90vw;display:flex;flex-direction:column;align-items:center;">
            <div style='font-size:2.5em;margin-bottom:0.5em;color:#27ae60;'>✅</div>
            <div style='font-size:1.25em;font-weight:bold;text-align:center;margin-bottom:1em;'>Bitcoin Lightning Payment Confirmed!</div>
            <button id='closeLightningPaidNotif' style='background:#27ae60;color:#fff;font-size:1.1em;padding:0.7em 2em;border:none;border-radius:8px;cursor:pointer;'>OK</button>
        </div>`;
        document.body.appendChild(notif);
        document.getElementById('closeLightningPaidNotif').onclick = function() {
            notif.remove();
            // Refresh app for new sale
            window.location.reload();
        };
    }
    </script>
