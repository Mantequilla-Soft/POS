<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display — Paygolin</title>
  <link rel="manifest" href="kitchen-manifest.json">
  <meta name="theme-color" content="#27ae60">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kitchen">
  <link rel="apple-touch-icon" href="images/kitchen-icon-192.png">
  <link rel="stylesheet" href="theme.css">
  <script src="i18n.js"></script>
  <style>
    body { background: #1a1a1a; color: #f0f0f0; font-family: sans-serif; margin: 0; min-height: 100vh; }

    /* ── Login screen ─────────────────────────────────────────── */
    #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    #loginScreen .card { background: #2a2a2a; border-radius: 12px; padding: 2rem; width: 100%; max-width: 360px; box-shadow: 0 4px 24px #0006; }
    #loginScreen h2 { margin: 0 0 1.5rem; text-align: center; color: var(--primary, #e07b27); }
    #loginScreen label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #bbb; }
    #loginScreen input[type=url],
    #loginScreen input[type=text],
    #loginScreen input[type=password] { width: 100%; box-sizing: border-box; padding: 0.65rem 0.8rem; border-radius: 7px; border: 1px solid #444; background: #333; color: #f0f0f0; font-size: 1rem; margin-bottom: 1rem; }
    #loginScreen .btn { width: 100%; padding: 0.75rem; border-radius: 8px; border: none; background: var(--primary, #e07b27); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    #loginScreen .btn:hover { opacity: 0.9; }
    #loginScreen .btn-green { background: #27ae60; }
    #loginScreen .btn-green:hover { background: #219a52; opacity: 1; }
    #loginScreen .err { color: #e74c3c; font-size: 0.85rem; margin-bottom: 0.75rem; min-height: 1.2em; text-align: center; }
    .remember-row { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; font-size: .85rem; color: #bbb; cursor: pointer; }
    .remember-row input { width: auto; margin: 0; cursor: pointer; }
    .quick-login-icon { font-size: 3.5rem; text-align: center; margin-bottom: .75rem; }
    .quick-login-name { font-size: .82rem; color: #888; text-align: center; margin-bottom: 1.25rem; }
    .link-btn { background: none; border: none; color: #888; font-size: .8rem; cursor: pointer; text-decoration: underline; width: 100%; margin-top: .75rem; padding: .25rem; }
    .link-btn:hover { color: #aaa; }

    /* ── Kitchen screen ───────────────────────────────────────── */
    #kitchenScreen { display: none; padding: 0.75rem; min-height: 100vh; }
    #kitchenHeader { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.25rem 1rem; border-bottom: 1px solid #333; margin-bottom: 1rem; }
    #kitchenHeader h1 { margin: 0; font-size: 1.3rem; color: var(--primary, #e07b27); }
    #kitchenHeader .meta { font-size: 0.8rem; color: #888; }
    #logoutBtn { background: #333; border: 1px solid #555; color: #ccc; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    #logoutBtn:hover { background: #444; }

    #ordersGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .order-card { background: #2a2a2a; border-radius: 10px; padding: 1rem; border: 2px solid #444; position: relative; }
    .order-card.all-ready { border-color: #27ae60; opacity: 0.7; }
    .order-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .table-badge { background: var(--primary, #e07b27); color: #fff; font-weight: 700; font-size: 1rem; padding: 0.2rem 0.75rem; border-radius: 20px; }
    .order-time { font-size: 0.75rem; color: #888; }
    .order-items { list-style: none; margin: 0; padding: 0; }
    .order-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid #333; }
    .order-item:last-child { border-bottom: none; }
    .order-item .qty { background: #444; border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.85rem; font-weight: 600; min-width: 1.8em; text-align: center; }
    .order-item .item-name { flex: 1; font-size: 0.95rem; }
    .order-item .item-notes { font-size: 0.78rem; color: #f0a500; font-style: italic; display: block; margin-top: 0.1rem; }
    .order-item.done .item-name { text-decoration: line-through; color: #888; }
    .ready-btn { background: none; border: 1px solid #555; color: #aaa; padding: 0.25rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
    .ready-btn.is-ready { background: #27ae60; border-color: #27ae60; color: #fff; }
    .ready-btn:hover { opacity: 0.8; }

    #emptyState { text-align: center; color: #555; padding: 4rem 1rem; font-size: 1.1rem; }
    #pollStatus { font-size: 0.72rem; color: #555; }
    #storeNameLabel { font-weight: 600; color: #ccc; }
    .order-card.late { border-color: #f39c12; }
    .order-card.very-late { border-color: #e74c3c; animation: pulse-border 1.5s ease-in-out infinite; }
    @keyframes pulse-border { 0%,100% { border-color:#e74c3c; } 50% { border-color:#c0392b; } }
    .order-elapsed { font-size: 0.7rem; padding: .15rem .45rem; border-radius: 10px; font-weight: 600; }
    .order-elapsed.ok   { background: #333; color: #888; }
    .order-elapsed.late { background: #f39c1233; color: #f39c12; }
    .order-elapsed.very-late { background: #e74c3c33; color: #e74c3c; }
  </style>
</head>
<body>

<!-- Login / PIN screen -->
<div id="loginScreen">
  <div class="card" id="loginCard">
    <!-- content injected by showLoginScreen() -->
  </div>
</div>

<!-- Kitchen display screen -->
<div id="kitchenScreen">
  <div id="kitchenHeader">
    <div>
      <h1 data-i18n="kitchen.title">🍳 Kitchen Display</h1>
      <div class="meta"><span id="storeNameLabel"></span> &nbsp;·&nbsp; <span id="pollStatus" data-i18n="common.loading">Loading…</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem;">
      <span id="kitchenLangToggle"></span>
      <button id="logoutBtn" data-i18n="kitchen.signOut">Sign Out</button>
    </div>
  </div>
  <div id="ordersGrid"></div>
  <div id="emptyState" style="display:none" data-i18n="kitchen.noOrders">No open orders right now. 🎉</div>
</div>

<script>
const API_BASE_KEY   = 'kitchen_api_base';
const STORE_ID_KEY   = 'kitchen_store_id';
const TOKEN_KEY      = 'kitchen_token';
const STORE_NAME_KEY = 'kitchen_store_name';
const SAVED_PIN_KEY  = 'kitchen_saved_pin';

let apiBase = localStorage.getItem(API_BASE_KEY) || '';
let storeId = localStorage.getItem(STORE_ID_KEY) || '';
let kitchenToken = localStorage.getItem(TOKEN_KEY) || '';
let pollTimer = null;

const loginScreen   = document.getElementById('loginScreen');
const loginCard     = document.getElementById('loginCard');
const kitchenScreen = document.getElementById('kitchenScreen');
const ordersGrid    = document.getElementById('ordersGrid');
const emptyState    = document.getElementById('emptyState');
const pollStatus    = document.getElementById('pollStatus');
const storeNameLabel = document.getElementById('storeNameLabel');

function getApi() { return (localStorage.getItem(API_BASE_KEY) || window.location.origin).replace(/\/$/, '') + '/api'; }

function t(key, vars) {
  return (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key, vars) : key;
}

// Prefill from URL params (shared kitchen link from admin)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('storeId') && !storeId) {
  storeId = urlParams.get('storeId');
  localStorage.setItem(STORE_ID_KEY, storeId);
}
if (urlParams.get('apiBase') && !apiBase) {
  apiBase = decodeURIComponent(urlParams.get('apiBase'));
  localStorage.setItem(API_BASE_KEY, apiBase);
}

// ── Login screen rendering ────────────────────────────────────

function showLoginScreen(errMsg) {
  loginScreen.style.display = 'flex';
  kitchenScreen.style.display = 'none';

  const savedPin = localStorage.getItem(SAVED_PIN_KEY);
  const hasCredentials = savedPin && apiBase && storeId;

  if (hasCredentials) {
    renderQuickLogin(errMsg);
  } else {
    renderFullLogin(errMsg);
  }

  i18n.renderLangToggle(document.getElementById('loginLangToggle'));
}

function renderQuickLogin(errMsg) {
  const storeName = localStorage.getItem(STORE_NAME_KEY) || storeId;
  loginCard.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1rem;">
      <span id="loginLangToggle"></span>
    </div>
    <div class="quick-login-icon">🍳</div>
    <div style="font-weight:700;font-size:1.1rem;text-align:center;margin-bottom:.35rem;color:#f0f0f0">${t('kitchen.title')}</div>
    <div class="quick-login-name">${escHtml(storeName)}</div>
    <div id="loginErr" class="err">${errMsg ? escHtml(errMsg) : ''}</div>
    <button class="btn btn-green" id="quickLoginBtn">${t('kitchen.enterBtn')}</button>
    <button class="link-btn" id="showFullLoginBtn">${t('kitchen.useDifferentPin')}</button>`;

  document.getElementById('quickLoginBtn').onclick = async () => {
    const btn = document.getElementById('quickLoginBtn');
    btn.disabled = true;
    btn.textContent = '…';
    const ok = await tryAutoLogin();
    if (ok) {
      showKitchen();
    } else {
      renderFullLogin(t('kitchen.invalidPin'));
    }
  };

  document.getElementById('showFullLoginBtn').onclick = () => {
    localStorage.removeItem(SAVED_PIN_KEY);
    renderFullLogin();
  };
}

function renderFullLogin(errMsg) {
  loginCard.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.5rem;">
      <h2 style="margin:0;" data-i18n="kitchen.title">🍳 Kitchen Display</h2>
      <span id="loginLangToggle"></span>
    </div>
    <div id="loginErr" class="err">${errMsg ? escHtml(errMsg) : ''}</div>
    <label data-i18n="kitchen.apiBaseLabel">API Base URL</label>
    <input type="url" id="apiBaseInput" placeholder="http://localhost:3001" autocomplete="off" value="${escHtml(apiBase || window.location.origin)}">
    <label data-i18n="kitchen.storeIdLabel">Store ID</label>
    <input type="text" id="storeIdInput" placeholder="${t('kitchen.storeIdPlaceholder')}" autocomplete="off" value="${escHtml(storeId)}">
    <label data-i18n="kitchen.pinLabel">Kitchen PIN</label>
    <input type="password" id="pinInput" placeholder="••••" maxlength="10" inputmode="numeric" autocomplete="off">
    <label class="remember-row">
      <input type="checkbox" id="rememberPinChk" checked>
      <span data-i18n="kitchen.rememberPin">Remember PIN on this device</span>
    </label>
    <button class="btn" id="loginBtn" data-i18n="kitchen.enterBtn">Enter Kitchen</button>`;

  i18n.applyTranslations(loginCard);
  i18n.renderLangToggle(document.getElementById('loginLangToggle'));

  const loginBtn = loginCard.querySelector('#loginBtn');
  const pinInput = loginCard.querySelector('#pinInput');

  loginBtn.onclick = async () => {
    const errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    const base = loginCard.querySelector('#apiBaseInput').value.trim().replace(/\/$/, '');
    const sid  = loginCard.querySelector('#storeIdInput').value.trim();
    const pin  = pinInput.value.trim();
    const remember = loginCard.querySelector('#rememberPinChk').checked;
    if (!base || !sid || !pin) { errEl.textContent = t('kitchen.allRequired'); return; }
    loginBtn.disabled = true;
    try {
      const res = await fetch(`${base}/api/kitchen/auth`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin, storeId: sid }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || t('kitchen.invalidPin'); return; }
      localStorage.setItem(API_BASE_KEY, base);
      localStorage.setItem(STORE_ID_KEY, sid);
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(STORE_NAME_KEY, data.storeName || '');
      if (remember) {
        localStorage.setItem(SAVED_PIN_KEY, pin);
      } else {
        localStorage.removeItem(SAVED_PIN_KEY);
      }
      kitchenToken = data.token;
      apiBase = base;
      storeId = sid;
      showKitchen();
    } catch (e) {
      document.getElementById('loginErr').textContent = t('kitchen.connectError');
    } finally {
      loginBtn.disabled = false;
    }
  };

  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });
}

// ── Auto-login with saved PIN ─────────────────────────────────

async function tryAutoLogin() {
  const savedPin = localStorage.getItem(SAVED_PIN_KEY);
  if (!savedPin || !apiBase || !storeId) return false;
  try {
    const res = await fetch(`${apiBase}/api/kitchen/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: savedPin, storeId }),
    });
    const data = await res.json();
    if (!res.ok) return false;
    localStorage.setItem(TOKEN_KEY, data.token);
    localStorage.setItem(STORE_NAME_KEY, data.storeName || '');
    kitchenToken = data.token;
    return true;
  } catch {
    return false;
  }
}

// ── Kitchen screen ────────────────────────────────────────────

document.getElementById('logoutBtn').onclick = () => {
  clearInterval(pollTimer);
  localStorage.removeItem(TOKEN_KEY);
  kitchenToken = '';
  showLoginScreen();
};

function showKitchen() {
  loginScreen.style.display = 'none';
  kitchenScreen.style.display = 'block';
  storeNameLabel.textContent = localStorage.getItem(STORE_NAME_KEY) || '';
  fetchOrders();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(fetchOrders, 8000);
}

async function fetchOrders() {
  try {
    const res = await fetch(`${getApi()}/kitchen/orders`, {
      headers: { 'Authorization': `Bearer ${localStorage.getItem(TOKEN_KEY)}` },
    });
    if (res.status === 401) {
      clearInterval(pollTimer);
      const reloggedIn = await tryAutoLogin();
      if (reloggedIn) { showKitchen(); return; }
      kitchenToken = '';
      localStorage.removeItem(TOKEN_KEY);
      showLoginScreen(t('kitchen.sessionExpired'));
      return;
    }
    const orders = await res.json();
    renderOrders(orders);
    const now = new Date().toLocaleTimeString();
    pollStatus.textContent = t('kitchen.updated', { time: now });
  } catch (e) {
    pollStatus.textContent = t('kitchen.connectionError');
  }
}

function elapsedMins(dateStr) {
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
}

function renderOrders(orders) {
  ordersGrid.innerHTML = '';
  if (!orders.length) {
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';
  orders.forEach(order => {
    const allReady = order.items.every(i => i.kitchenStatus === 'ready');
    const mins = elapsedMins(order.openedAt || order.createdAt);
    const urgency = mins >= 20 ? 'very-late' : mins >= 10 ? 'late' : '';
    const card = document.createElement('div');
    card.className = 'order-card' + (allReady ? ' all-ready' : urgency ? ` ${urgency}` : '');
    const opened = new Date(order.openedAt || order.createdAt);
    const timeStr = opened.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const tableLabel = order.tableLabel || (order.tableId ? `${t('kitchen.tablePrefix')} ${order.tableId}` : t('kitchen.counter'));
    const elapsedLabel = mins < 1 ? t('kitchen.lessThanMin') : t('kitchen.mins', { n: mins });
    const elapsedClass = urgency || 'ok';
    card.innerHTML = `
      <div class="order-card-header">
        <span class="table-badge">${escHtml(tableLabel)}</span>
        <span class="order-elapsed ${elapsedClass}">${elapsedLabel}</span>
      </div>
      <ul class="order-items" id="items-${order._id}">
        ${order.items.map((item, idx) => renderItem(order._id, item, idx)).join('')}
      </ul>`;
    ordersGrid.appendChild(card);
  });
}

function renderItem(orderId, item, idx) {
  const done = item.kitchenStatus === 'ready';
  return `<li class="order-item${done ? ' done' : ''}" id="item-${orderId}-${idx}">
    <span class="qty">${item.qty}×</span>
    <span class="item-name">
      ${escHtml(item.name)}
      ${item.notes ? `<span class="item-notes">${escHtml(item.notes)}</span>` : ''}
    </span>
    <button class="ready-btn${done ? ' is-ready' : ''}" onclick="toggleItem('${orderId}',${idx},'${done ? 'pending' : 'ready'}')">
      ${done ? t('kitchen.ready') : t('kitchen.markReady')}
    </button>
  </li>`;
}

async function toggleItem(orderId, idx, newStatus) {
  try {
    const res = await fetch(`${getApi()}/kitchen/orders/${orderId}/items/${idx}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem(TOKEN_KEY)}` },
      body: JSON.stringify({ kitchenStatus: newStatus }),
    });
    if (!res.ok) return;
    const updated = await res.json();
    const listEl = document.getElementById(`items-${orderId}`);
    if (listEl) {
      listEl.innerHTML = updated.items.map((item, i) => renderItem(orderId, item, i)).join('');
      const allReady = updated.items.every(i => i.kitchenStatus === 'ready');
      const card = listEl.closest('.order-card');
      if (card) card.className = 'order-card' + (allReady ? ' all-ready' : '');
    }
  } catch (e) {
    console.error('toggleItem error', e);
  }
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────

function init() {
  i18n.init();
  i18n.renderLangToggle(document.getElementById('kitchenLangToggle'));
  if (kitchenToken) {
    showKitchen();
  } else {
    showLoginScreen();
  }
}

// ── Service Worker ────────────────────────────────────────────

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}

init();
</script>
</body>
</html>
